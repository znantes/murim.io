<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murim — V4 cohérente</title><style>body{background:#090c11;color:#edf1f6;font:14px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:20px}.card{background:#121720;border:1px solid #293443;border-radius:12px;padding:15px;margin-bottom:12px}button{background:#1a2330;color:#fff;border:1px solid #293443;border-radius:8px;padding:10px;margin:3px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;flex-wrap:wrap;gap:6px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.story{max-height:430px;overflow:auto}.event{padding:8px 0;border-bottom:1px solid #222b37}.stat{margin:7px 0}.bar{height:6px;background:#252e39}.bar i{display:block;height:100%;background:#c9a76b}@media(max-width:700px){.choices{grid-template-columns:1fr}}</style></head><body><main><div class="card"><h1>MURIM</h1><div id="identity"></div><div class="row"><button onclick="newLife()">Nouvelle vie</button><button onclick="randomLife()">Vie aléatoire</button><button onclick="saveGame()">Sauvegarder</button><button onclick="loadGame()">Charger</button><button onclick="full()">⛶</button></div></div><div class="card"><h2>État</h2><div id="stats"></div><div id="needs"></div><div class="row"><button id="feed" onclick="act('feed')">Être nourri</button><button id="drink" onclick="act('drink')">Boire</button><button id="sleep" onclick="act('sleep')">Dormir</button><button id="work" onclick="act('work')">Travailler</button><button id="train" onclick="act('train')">S'entraîner</button><button id="travel" onclick="act('travel')">Voyager</button><button id="explore" onclick="act('explore')">Explorer</button></div><p id="guidance"></p></div><div class="card"><h2>Chronique</h2><div id="clock"></div><div class="story" id="story"></div><h3>Que faites-vous ?</h3><div class="choices" id="choices"></div></div><div class="card"><h2>Monde</h2><div id="world"></div><h3>Personnes présentes</h3><div id="npcs"></div></div></main><script>
'use strict';const KEY='murim_v4_coherent';let g=null;
const places=['Village de Qinghe','Cité de Hanyang','Forêt des Pins Noirs','Vallée de Jade','Monts du Ciel'];const roles=['paysan','marchand','artisan','médecin','garde','disciple','voyageur','chasseur'];const names=['Han Jiwon','Seo Mira','Baek Hyeon','Yun Ara','Kang Min','Jin Seol','Mu Ryu','Choi Nara'];
function r(a,b){return Math.random()*(b-a)+a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function c(v,a=0,b=100){return Math.max(a,Math.min(b,v))}function ir(a,b){return Math.floor(r(a,b+1))}
function npc(){return{name:pick(names),age:ir(6,70),role:pick(roles),place:pick(places),alive:true,relation:ir(-10,12),power:r(3,20)}}
function newLife(random=false){let age=random?ir(16,30):0;g={day:1,age,daysInAge:0,name:pick(names),place:pick(places),health:100,money:random?ir(20,100):0,food:random?ir(2,7):1,water:random?ir(1,5):1,needs:{hunger:r(0,12),thirst:r(0,12),sleep:r(0,8),fatigue:r(0,6)},stats:{force:r(2,8),spirit:r(2,8),constitution:r(2,8),agility:r(2,8),intelligence:r(2,8),reputation:0},skills:{craft:0,scholar:0,survival:0,combat:random?r(1,5):0},injury:0,injuryDays:0,dead:false,events:[],npcs:[],world:{prosperity:55,banditry:25,war:8}};for(let i=0;i<14;i++)g.npcs.push(npc());story(age===0?'Vous venez de naître. Vous dépendez entièrement des adultes.':'Vous commencez une nouvelle vie dans un monde qui n’attend pas votre arrivée.');render()}
function story(t){g.events.unshift({day:g.day,text:t});g.events=g.events.slice(0,100)}
function advance(days=1){days=Math.max(1,Math.floor(days));for(let i=0;i<days;i++){g.day++;g.daysInAge++;if(g.daysInAge>=365){g.daysInAge=0;g.age++;story('Votre anniversaire passe. Vous avez maintenant '+g.age+' ans.')}let ageFactor=g.age<3?1.5:g.age<10?1.15:g.age>60?1.1:1;g.needs.hunger=c(g.needs.hunger+.7*ageFactor);g.needs.thirst=c(g.needs.thirst+.95*ageFactor);g.needs.sleep=c(g.needs.sleep+.55*ageFactor);g.needs.fatigue=c(g.needs.fatigue+.28*ageFactor);if(g.injuryDays>0){g.injuryDays--;if(g.injuryDays===0){g.injury=c(g.injury-25);story('Votre blessure commence à cicatriser.')}}for(const n of g.npcs)if(n.alive){if(Math.random()<1/365)n.age++;if(n.age>85&&Math.random()<.03)n.alive=false;if(Math.random()<.012)n.place=pick(places)}g.world.banditry=c(g.world.banditry+r(-.15,.2));g.world.prosperity=c(g.world.prosperity+r(-.3,.3));if(Math.random()<.025)worldEvent();if(g.needs.hunger>96||g.needs.thirst>96||g.needs.fatigue>98)g.health=c(g.health-.8);if(g.injury>0)g.health=c(g.health-g.injury*.004);if(g.health<=0){g.dead=true;story('☠ Votre vie s’achève.')}}render()}
function worldEvent(){let e=pick(['Une caravane arrive.','Des bandits sont signalés sur une route.','Un médecin itinérant propose ses services.','Une rumeur parle d’un maître inconnu.','Un marché local devient très animé.','Une querelle éclate entre disciples.']);story(e)}
function ageText(){if(g.age<3)return'0–2 ans : alimentation, sommeil, protection et observation. Aucun entraînement, travail ou voyage autonome.';if(g.age<7)return'3–6 ans : jeu, langage, imitation et petites tâches familiales. Pas de pratique martiale sérieuse.';if(g.age<10)return'7–9 ans : apprentissage scolaire, petites tâches et activité physique légère sous surveillance.';if(g.age<13)return'10–12 ans : apprentissage encadré, métier progressif et préparation physique. Pas encore d’entraînement martial dangereux.';if(g.age<16)return'13–15 ans : véritable entraînement martial possible, mais corps encore en développement.';return'16+ ans : autonomie croissante, voyages et risques réels.'}
function act(type){if(!g||g.dead)return;let a=g.age;if(type==='feed'){if(g.food>0){g.food--;g.needs.hunger=c(g.needs.hunger-35);story(a<3?'Un adulte veille à votre alimentation.':'Vous prenez un repas.');render()}return}if(type==='drink'){if(g.water>0){g.water--;g.needs.thirst=c(g.needs.thirst-40);story(a<3?'Un adulte vous fait boire.':'Vous buvez.');render()}return}if(type==='sleep'){let h=a<3?12:a<7?10:8;g.needs.sleep=c(g.needs.sleep-h*4.7);g.needs.fatigue=c(g.needs.fatigue-h*4.9);g.health=c(g.health+(g.injury?0.5:1.5));advance(1);story('Vous dormez '+h+' heures.');return}if(type==='work'){if(a<7){story('Vous êtes trop jeune pour travailler.');advance(a<3?2:1);return}if(a<10){story('Vous aidez votre famille pour une petite tâche, sans vrai salaire.');g.skills.craft=c(g.skills.craft+r(.03,.1),0,20);advance(1);return}let pay=Math.max(1,ir(Math.round(2+g.stats.intelligence*.2),Math.round(5+g.stats.intelligence*.5)));g.money+=pay;g.needs.fatigue=c(g.needs.fatigue+7);g.needs.hunger=c(g.needs.hunger+6);g.skills.craft=c(g.skills.craft+r(.05,.18),0,20);advance(1);story('Votre travail vous rapporte '+pay+' pièces.');return}if(type==='train'){if(a<7){story('Vous ne vous entraînez pas aux arts martiaux. Votre corps est encore trop jeune.');advance(a<3?2:1);return}if(a<10){story('Vous faites seulement des jeux et exercices physiques légers.');g.stats.agility=c(g.stats.agility+.02);advance(1);return}if(a<13){story('Vous travaillez posture, mobilité et respiration sous supervision.');g.skills.combat=c(g.skills.combat+.04);advance(1);return}let intensity=r(.35,.85),readiness=g.stats.constitution*.55+g.stats.spirit*.25+g.stats.agility*.2,control=g.stats.spirit*.5+g.stats.intelligence*.28+g.stats.constitution*.22;let success=c(.25+readiness*.026+control*.016-intensity*.3-(a<16?.12:a>55?.1:0),.03,.95),injury=c(intensity*.45+Math.max(0,5-g.stats.constitution)*.06+g.injury*.005,.02,.86);g.needs.fatigue=c(g.needs.fatigue+14+intensity*10);advance(1);if(Math.random()<injury){g.injury=c(g.injury+r(8,25));g.injuryDays=Math.max(g.injuryDays,ir(3,16));g.health=c(g.health-r(3,12));story('L’entraînement provoque une blessure.')}else if(Math.random()<success){let k=pick(['force','spirit','constitution','agility','intelligence']);g.stats[k]=c(g.stats[k]+r(.05,.3));g.skills.combat=c(g.skills.combat+r(.03,.14),0,20);story('Votre maîtrise progresse lentement : '+k+'.')}else story('La séance est correcte, mais le progrès est faible.');render();return}if(type==='travel'){if(a<7){story('Vous ne voyagez pas seul à cet âge.');advance(1);return}let dest=pick(places.filter(x=>x!==g.place)),days=ir(Math.max(2,2+Math.floor(r(0,7))),(a<16?10:15));g.place=dest;g.needs.fatigue=c(g.needs.fatigue+days*2);g.needs.hunger=c(g.needs.hunger+days*.8);g.needs.thirst=c(g.needs.thirst+days);advance(days);story('Vous arrivez à '+dest+' après '+days+' jours de route.');return}if(type==='explore'){if(a<7){story('Vous restez dans un environnement protégé.');advance(1);return}let danger=(1-(g.place.includes('Village')?.82:g.place.includes('Cité')?.72:g.place.includes('Vallée')?.6:g.place.includes('Forêt')?.35:.2));if(a<13)danger*=.35;let chance=c(.2+g.stats.intelligence*.025+g.stats.agility*.018+g.skills.survival*.02-danger*.25,.05,.85);advance(a<13?1:2);if(Math.random()<chance){story('Vous découvrez une piste, une ressource ou un lieu intéressant.');g.skills.survival=c(g.skills.survival+r(.05,.2))}else story('Votre exploration ne donne rien de certain.');if(Math.random()<danger*.12){g.injury=c(g.injury+r(5,15));g.injuryDays=Math.max(g.injuryDays,ir(2,9));story('Le terrain vous blesse.')}return}}
function choices(){if(g.dead)return[];if(g.age<3)return[{t:'Observer',d:'Découvrir les visages et les voix.',f:()=>g.stats.intelligence=c(g.stats.intelligence+.01),days:1},{t:'Rester en famille',d:'Protection et attachement.',f:()=>g.needs.fatigue=c(g.needs.fatigue-3),days:2}];if(g.age<7)return[{t:'Jouer',d:'Coordination et premières relations.',f:()=>g.stats.agility=c(g.stats.agility+.02),days:1},{t:'Aider la famille',d:'Petites tâches adaptées.',f:()=>g.stats.intelligence=c(g.stats.intelligence+.015),days:2},{t:'Observer un pratiquant',d:'Apprendre sans copier.',f:()=>g.skills.scholar=c(g.skills.scholar+.05),days:1}];if(g.age<13)return[{t:'Étudier',d:'Lecture, calcul et mémoire.',f:()=>g.skills.scholar=c(g.skills.scholar+.12),days:3},{t:'Apprendre un métier',d:'Savoir-faire utile.',f:()=>g.skills.craft=c(g.skills.craft+.12),days:3},{t:'Préparer son corps',d:'Mobilité et discipline.',f:()=>g.stats.constitution=c(g.stats.constitution+.025),days:2}];return[{t:'Parler à quelqu’un',d:'Relations, confiance et informations.',f:()=>talk(),days:1},{t:'Chercher un maître',d:'Ils sont rares et ne sont pas tous fiables.',f:()=>{g.skills.combat=c(g.skills.combat+.08);g.stats.reputation=c(g.stats.reputation+.3,-100,100)},days:3},{t:'Chercher du travail',d:'Gagner de l’argent et de l’expérience.',f:()=>act('work'),days:1},{t:'Suivre une rumeur',d:'Une information peut être vraie ou fausse.',f:()=>rumor(),days:2}]}function choose(i){let q=choices()[i];if(!q)return;q.f();if(q.days>0&&g.age>0)advance(q.days);story(q.t);render()}function talk(){let n=g.npcs.find(n=>n.alive&&n.place===g.place);if(!n){story('Personne n’est disponible ici.');return}n.relation=c(n.relation+r(1,4),-100,100);story(n.name+' accepte de parler avec vous. Relation : '+n.relation+'.')}function rumor(){story(Math.random()<.65?'La rumeur semble partiellement crédible.':'La rumeur était fausse ou déformée.')}function saveGame(){localStorage.setItem(KEY,JSON.stringify(g));story('Sauvegarde effectuée.');render()}function loadGame(){let x=localStorage.getItem(KEY);if(!x){newLife();return}try{g=JSON.parse(x);render();story('Sauvegarde chargée.');render()}catch(e){newLife()}}function full(){document.documentElement.requestFullscreen?.()}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){if(!g)return;document.getElementById('identity').innerHTML='<b>'+esc(g.name)+'</b> · '+g.age+' ans · '+esc(g.place)+(g.dead?' · ☠ Mort':'');let stats=[['force','Force'],['spirit','Esprit'],['constitution','Constitution'],['agility','Agilité'],['intelligence','Intelligence'],['reputation','Réputation']];document.getElementById('stats').innerHTML=stats.map(x=>{let min=x[0]=='reputation'?-100:0,max=x[0]=='reputation'?100:30,w=(g.stats[x[0]]-min)/(max-min)*100;return'<div class="stat"><b>'+x[1]+' '+g.stats[x[0]].toFixed(1)+'</b><div class="bar"><i style="width:'+c(w)+'%"></i></div></div>'}).join('');document.getElementById('needs').innerHTML='Santé <b>'+g.health.toFixed(0)+'</b> · Faim '+g.needs.hunger.toFixed(0)+' · Soif '+g.needs.thirst.toFixed(0)+' · Sommeil '+g.needs.sleep.toFixed(0)+' · Fatigue '+g.needs.fatigue.toFixed(0)+' · Nourriture '+g.food+' · Eau '+g.water+' · Argent '+g.money;document.getElementById('guidance').textContent=ageText();document.getElementById('clock').textContent='Jour '+g.day+' · Monde : prospérité '+g.world.prosperity.toFixed(0)+' · banditisme '+g.world.banditry.toFixed(0)+'%';let qs=choices();document.getElementById('choices').innerHTML=qs.map((q,i)=>'<button onclick="choose('+i+')"><b>'+esc(q.t)+'</b><br><small>'+esc(q.d)+'</small></button>').join('');document.getElementById('story').innerHTML=g.events.map(e=>'<div class="event"><small>Jour '+e.day+'</small><br>'+esc(e.text)+'</div>').join('');let btn=(id,min)=>document.getElementById(id).disabled=g.age<min||g.dead;btn('train',7);btn('work',7);btn('travel',7);btn('explore',7);document.getElementById('npcs').innerHTML=g.npcs.filter(n=>n.alive&&n.place===g.place).map(n=>'<div>'+esc(n.name)+' · '+n.age+' ans · '+esc(n.role)+' · relation '+n.relation+'</div>').join('')||'Personne de connu ici.'}
newLife();
</script></body></html>
