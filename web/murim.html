<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Murim — Vrai mode de vie</title>
<style>
:root{--bg:#090c11;--panel:#121720;--panel2:#171e29;--line:#293443;--txt:#edf1f6;--muted:#98a5b6;--gold:#c9a76b;--red:#d36d6d;--green:#78b68a;--blue:#78a7d2;--purple:#aa8fd0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#1a2230 0,#090c11 46%,#06080b 100%);color:var(--txt);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}button{color:var(--txt);background:#1a2330;border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer;transition:.12s}button:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}.gold{background:#755d36;border-color:#a88853}.danger{background:#392024;border-color:#67383e}.mini{padding:6px 8px;font-size:12px}.app{max-width:1600px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}.brand{font-size:29px;font-weight:850;letter-spacing:.13em}.subtitle{color:var(--muted)}.toolbar,.row{display:flex;gap:7px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:300px minmax(480px,1fr) 360px;gap:12px}.panel{background:linear-gradient(180deg,#131a24,#0e131b);border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:0 16px 50px #0006}.panel h2{margin:0 0 9px}.panel h3{margin:16px 0 7px}.center{min-height:calc(100vh - 95px)}.story{height:455px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#080c11;padding:12px}.entry{padding:10px 0;border-bottom:1px solid #1f2732}.entry:last-child{border-bottom:0}.entry .day{font-size:11px;color:var(--muted)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.choice{text-align:left;min-height:70px}.choice b{display:block;margin-bottom:4px}.sub{font-size:12px;color:var(--muted)}.section{background:#111822;border:1px solid #222c39;border-radius:10px;padding:9px;margin-top:9px}.stat{margin:8px 0}.statline{display:flex;justify-content:space-between;gap:8px}.bar{height:7px;background:#252e3a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.green i{background:var(--green)}.blue i{background:var(--blue)}.purple i{background:var(--purple)}.pill{display:inline-flex;gap:4px;align-items:center;padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;margin:2px}.bad{color:var(--red)}.cards{display:grid;gap:7px}.npc,.faction,.item,.quest{padding:8px;border-radius:8px;background:#101722;border:1px solid #212b38}.npc b,.faction b,.item b{display:block}.between{display:flex;justify-content:space-between;gap:7px}.worldgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.location{padding:10px;border:1px solid var(--line);border-radius:9px;background:#101722;cursor:pointer}.location:hover{border-color:var(--gold)}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{width:min(820px,100%);max-height:90vh;overflow:auto;background:#121821;border:1px solid var(--line);border-radius:13px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid label{display:grid;gap:5px;color:var(--muted)}input,select{width:100%;background:#0c1118;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px}.hero{padding:12px;background:linear-gradient(135deg,#1b2431,#111720);border:1px solid var(--line);border-radius:10px}.dangerline{border-left:3px solid var(--red);padding-left:9px}.notice{border-left:3px solid var(--gold);padding-left:9px}:fullscreen .app{max-width:none}
@media(max-width:1180px){.grid{grid-template-columns:1fr}.center{min-height:0}.story{height:360px}}@media(max-width:650px){.choices,.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.worldgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div><div class="brand">MURIM</div><div class="subtitle">Une vie parmi des milliers — aucun destin ne vous attend.</div></div><div class="toolbar"><button class="gold" onclick="openCreation()">Nouvelle vie</button><button onclick="randomLife()">Vie aléatoire</button><button onclick="saveGame()">Sauvegarder</button><button onclick="loadGame()">Charger</button><button onclick="toggleFull()">⛶ Plein écran</button></div></header>
<div class="grid">
<aside class="panel"><h2 id="identityTitle">Personnage</h2><div id="identity"></div><h3>Attributs</h3><div id="stats"></div><h3>État physique</h3><div id="needs"></div><h3>Argent & objets</h3><div id="resources"></div><div class="row" style="margin-top:10px"><button onclick="act('eat')">Manger</button><button onclick="act('drink')">Boire</button><button onclick="act('sleep')">Dormir</button></div><h3>Actions</h3><div class="row"><button onclick="act('train')">Entraînement</button><button onclick="act('work')">Travailler</button><button onclick="act('travel')">Voyager</button><button onclick="act('explore')">Explorer</button></div></aside>
<main class="panel center"><div class="between"><div><h2>Chronique</h2><div class="muted" id="date"></div></div><div id="statusPills"></div></div><div class="story" id="story"></div><div class="choices" id="choices"></div><div class="section"><div class="between"><b>Monde proche</b><span class="muted">les événements continuent sans vous</span></div><div class="worldgrid" id="nearby"></div></div></main>
<aside class="panel"><h2>Monde vivant</h2><div id="world"></div><h3>Relations</h3><div class="cards" id="relations"></div><h3>Factions</h3><div class="cards" id="factions"></div><h3>Rumeurs</h3><div class="cards" id="rumors"></div><h3>Journal</h3><div class="cards" id="journal"></div></aside>
</div></div>
<div class="modal" id="modal"><div class="modalbox"><div id="modalContent"></div></div></div>
<script>
'use strict';
const KEY='murim_html_v3';
const LOCS=[{id:'qinghe',name:'Village de Qinghe',region:'Plaines du Nord',terrain:'Village',safety:.82,travel:1},{id:'blackpine',name:'Forêt des Pins Noirs',region:'Monts occidentaux',terrain:'Forêt',safety:.35,travel:1.55},{id:'hanyang',name:'Cité de Hanyang',region:'Royaume central',terrain:'Cité',safety:.72,travel:.95},{id:'jade',name:'Vallée de Jade',region:'Sud',terrain:'Vallée',safety:.62,travel:1.25},{id:'heaven',name:'Monts du Ciel',region:'Frontière nord',terrain:'Montagne',safety:.22,travel:2.1},{id:'redriver',name:'Port de la Rivière Rouge',region:'Est',terrain:'Port',safety:.58,travel:.9},{id:'barren',name:'Routes des Terres Brûlées',region:'Ouest',terrain:'Steppe',safety:.28,travel:1.8},{id:'academy',name:'Académie de Cheolhan',region:'Royaume central',terrain:'Académie',safety:.9,travel:1.1}];
const FACTIONS=[['Alliance des Neuf Sectes','Ordre'],['Grandes Familles','Influence'],['Palais Extérieur','Commerce'],['Réseaux criminels','Ombres'],['Culte Démoniaque','Fanatisme']];
const NF=['Seo Mira','Yun Ara','Jin Seol','Choi Nara','Im Sora','Han Yeon','Baek Rin','Moon Hae'];const NM=['Han Jiwon','Baek Hyeon','Kang Min','Mu Ryu','Park Dojin','Jang Woo','Seo Gyeom','Yun Tae'];const ROLES=['paysan','marchand','garde','médecin','artisan','disciple','voyageur','moine','chasseur','fonctionnaire','bandit'];let game=null;
function rnd(a,b){return Math.random()*(b-a)+a}function irnd(a,b){return Math.floor(rnd(a,b+1))}function pick(a){return a[Math.floor(Math.random()*a.length)]}function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}function loc(id){return LOCS.find(x=>x.id===id)||LOCS[0]}
function baseStats(){return{force:rnd(2,8),spirit:rnd(2,8),constitution:rnd(2,8),agility:rnd(2,8),intelligence:rnd(2,8),reputation:0}}
function newNpc(placeId,opts={}){let sex=opts.sex||pick(['Homme','Femme']);let role=opts.role||pick(ROLES);return{id:crypto.randomUUID(),name:opts.name||(sex==='Femme'?pick(NF):pick(NM)),sex,age:opts.age??irnd(8,68),role,placeId,alive:true,relation:opts.relation??irnd(-8,14),stats:{force:rnd(3,20),spirit:rnd(2,20),constitution:rnd(3,20),agility:rnd(2,20),intelligence:rnd(3,20),reputation:rnd(-20,25)},wealth:irnd(0,80),faction:opts.faction||pick(FACTIONS)[0],skill:irnd(0,7),status:'Ordinaire',history:pick(['a une famille à charge','doit de l’argent','cherche un maître','a déjà voyagé loin','cache une vieille blessure','rêve de quitter sa ville','travaille pour survivre'])}}
function makeGame({random=false}={}){let age=random?irnd(14,34):0;game={version:3,day:1,age,daysSinceBirthday:0,dead:false,name:random?pick([...NF,...NM]):pick([...NF,...NM]),sex:pick(['Homme','Femme']),placeId:pick(LOCS).id,stats:baseStats(),health:100,qi:random?rnd(20,45):5,needs:{hunger:rnd(0,18),thirst:rnd(0,18),sleep:rnd(0,15),fatigue:rnd(0,8)},money:random?irnd(30,140):0,food:random?irnd(2,8):1,water:random?irnd(1,5):1,injury:0,injuryDays:0,skills:{combat:random?rnd(2,8):0,medicine:random?rnd(0,4):0,craft:random?rnd(0,4):0,survival:random?rnd(0,4):0,scholar:random?rnd(0,4):0},factions:FACTIONS.map(f=>({name:f[0],stance:f[1],rep:rnd(-5,8)})),npcs:[],events:[],journal:[],rumors:[],world:{prosperity:55,warLevel:8,banditry:28,plague:2}};for(let i=0;i<18;i++)game.npcs.push(newNpc(pick(LOCS).id));let m=newNpc(game.placeId,{name:'Maître de passage',role:'disciple',age:irnd(25,55)});m.stats.force=rnd(18,42);m.stats.spirit=rnd(15,38);m.stats.constitution=rnd(15,38);m.stats.agility=rnd(14,36);m.stats.intelligence=rnd(12,32);m.status='Combattant expérimenté';game.npcs.push(m);story(age===0?'Vous venez de naître. Les premières années seront consacrées à survivre, grandir et observer.':'Vous commencez votre vie adulte dans un monde où des milliers d’autres personnes poursuivent leurs propres ambitions.');log('Votre vie commence.');render()}
function story(text){game.events.unshift({day:game.day,text});game.events=game.events.slice(0,120)}function log(text){game.journal.unshift(`[${dateLabel()}] ${text}`);game.journal=game.journal.slice(0,60)}function dateLabel(){let y=Math.floor((game.day-1)/365)+1,d=((game.day-1)%365)+1,s=['Printemps','Été','Automne','Hiver'][Math.floor(((d-1)/365)*4)];return`An ${y}, jour ${d} — ${s}`}
function ageUp(){game.age++;game.daysSinceBirthday=0;if([6,10,13,16,40,60].includes(game.age))story(game.age===6?'Vous commencez à comprendre les conversations des adultes.':game.age===10?'Votre corps supporte maintenant certains apprentissages simples.':game.age===13?'Certains maîtres acceptent désormais de vrais disciples.':game.age===16?'Vous êtes considéré comme jeune adulte dans la plupart des régions.':game.age===40?'Votre récupération commence à changer avec l’âge.':'Les efforts extrêmes deviennent dangereusement coûteux.')}
function die(reason){game.dead=true;story('☠ '+reason);log('Votre vie s’achève.')}function worldTick(){game.world.prosperity=clamp(game.world.prosperity+rnd(-.35,.35));game.world.banditry=clamp(game.world.banditry+rnd(-.2,.25));game.world.warLevel=clamp(game.world.warLevel+rnd(-.12,.12));if(Math.random()<.002)game.world.plague=clamp(game.world.plague+rnd(2,8));if(Math.random()<.004)game.world.plague=clamp(game.world.plague-rnd(1,4))}
function survivalTick(){let n=game.needs;if(n.hunger>92||n.thirst>92||n.fatigue>96)game.health=clamp(game.health-.7);if(game.injury>0)game.health=clamp(game.health-.06*game.injury/10);if(game.health<=0)die('Votre corps n’a plus assez de réserves pour continuer.');}
function npcTick(){for(let n of game.npcs){if(!n.alive)continue;if(Math.random()<1/365)n.age++;if(n.age>85&&Math.random()<.03)n.alive=false;if(Math.random()<.015)n.placeId=pick(LOCS).id;if(Math.random()<.001)n.stats.reputation=clamp(n.stats.reputation+rnd(-2,2),-100,100)}}
function advance(days=1,reason=''){if(!game||game.dead)return;days=Math.max(1,Math.floor(days));for(let i=0;i<days;i++){game.day++;game.daysSinceBirthday++;if(game.daysSinceBirthday>=365)ageUp();let a=game.age<4?1.45:game.age<10?1.15:game.age>60?1.12:1;game.needs.hunger=clamp(game.needs.hunger+.7*a);game.needs.thirst=clamp(game.needs.thirst+.95*a);game.needs.sleep=clamp(game.needs.sleep+.55*a);game.needs.fatigue=clamp(game.needs.fatigue+.28*a);if(game.injuryDays>0){game.injuryDays--;if(game.injuryDays===0){game.injury=clamp(game.injury-25);story('Votre blessure commence à se refermer.')}}worldTick();survivalTick();npcTick();if(Math.random()<.035){let e=pick(['Une caravane arrive dans la région.','Des bandits sont signalés sur une route.','Un médecin itinérant ouvre une consultation.','Une rumeur parle d’un maître disparu.','Des prix alimentaires montent au marché.','Une petite querelle entre disciples devient publique.','Une famille noble recrute des gens fiables.','Des émissaires d’une secte arrivent.']);story(e)}}if(reason)log(reason);render()}
function randomLife(){makeGame({random:true})}
function openCreation(){showModal(`<h2>Commencer une vie</h2><div class="sub">Pas de héros prédestiné. Votre origine change les possibilités, pas votre avenir.</div><div class="formgrid" style="margin-top:12px"><label>Nom<input id="cName" placeholder="Nom du personnage"></label><label>Sexe<select id="cSex"><option>Homme</option><option>Femme</option></select></label><label>Âge<select id="cAge"><option value="0">Nouveau-né</option><option value="6">6 ans</option><option value="12">12 ans</option><option value="16">16 ans</option><option value="25">25 ans</option></select></label><label>Origine<select id="cOrigin"><option value="poor">Famille modeste</option><option value="merchant">Famille marchande</option><option value="martial">Milieu martial</option></select></label></div><div class="row" style="margin-top:14px"><button class="gold" onclick="createCharacter()">Commencer</button><button onclick="closeModal()">Annuler</button></div>`)}
function createCharacter(){let name=document.getElementById('cName').value.trim()||pick([...NF,...NM]),age=+document.getElementById('cAge').value,sex=document.getElementById('cSex').value,origin=document.getElementById('cOrigin').value;makeGame();game.name=name;game.age=age;game.sex=sex;if(origin==='merchant'){game.money=100;game.stats.intelligence=rnd(4,9);game.stats.reputation=rnd(0,8)}if(origin==='martial'){game.qi=30;game.skills.combat=rnd(1,5);game.stats.spirit=rnd(4,10);game.stats.agility=rnd(3,9)}closeModal();story(`Vous commencez votre vie à ${age} ans, dans un milieu ${origin==='poor'?'modeste':origin==='merchant'?'marchand':'martial'}.`);render()}
function train(){if(game.age<7){story('Votre corps est trop jeune pour un véritable entraînement martial.');advance(1);return}let s=game.stats,age=game.age,body=s.constitution*.55+s.agility*.2+s.spirit*.25,ctrl=s.spirit*.5+s.intelligence*.28+s.constitution*.22,intensity=rnd(.38,.88);let success=clamp(.28+body*.026+ctrl*.016-intensity*.3-(age<13?.2:age>55?.12:0),.03,.96),inj=clamp(intensity*.45+Math.max(0,5-s.constitution)*.06+game.injury*.006+(age<13||age>55?.08:0),.03,.9);game.needs.fatigue=clamp(game.needs.fatigue+14+intensity*12);advance(1,'Journée d’entraînement');if(Math.random()<inj){game.injury=clamp(game.injury+rnd(8,28));game.health=clamp(game.health-rnd(3,12));game.injuryDays=Math.max(game.injuryDays,irnd(3,16));story('L’entraînement provoque une blessure. La récupération devient prioritaire.')}else if(Math.random()<success){let k=pick(['force','spirit','constitution','agility','intelligence']),gain=rnd(.08,.38)*(1-game.stats[k]/120);game.stats[k]=clamp(game.stats[k]+gain);game.skills.combat=clamp(game.skills.combat+rnd(.03,.16),0,20);story(`Votre discipline porte un petit fruit : ${k} +${gain.toFixed(2)}.`)}else story('La séance est correcte, mais votre maîtrise progresse à peine.');render()}
function work(){if(game.age<10){story('Vous êtes trop jeune pour un véritable travail.');advance(1);return}let gain=Math.max(1,Math.round(rnd(2,6)+game.stats.intelligence*.75+game.stats.reputation*.1));game.money+=gain;game.needs.fatigue=clamp(game.needs.fatigue+9);game.needs.hunger=clamp(game.needs.hunger+7);let sk=pick(['craft','survival','scholar']);game.skills[sk]=clamp(game.skills[sk]+rnd(.05,.2),0,20);advance(irnd(1,3),`Travail : +${gain} pièces.`);story(`Votre travail rapporte ${gain} pièces et développe vos compétences.`)}
function travel(){let dest=pick(LOCS.filter(x=>x.id!==game.placeId)),cur=loc(game.placeId),distance=irnd(2,13),days=Math.max(1,Math.round(distance*cur.travel*dest.travel/((1.15+game.stats.agility/100)*(1-game.needs.fatigue/250))));game.placeId=dest.id;game.needs.fatigue=clamp(game.needs.fatigue+days*2.2);game.needs.hunger=clamp(game.needs.hunger+days*.9);game.needs.thirst=clamp(game.needs.thirst+days*1.1);advance(days,`Voyage vers ${dest.name} (${days} jours).`);story(`Vous arrivez à ${dest.name}.`);if(Math.random()<(1-dest.safety)*.12){game.injury=clamp(game.injury+rnd(5,18));game.injuryDays=Math.max(game.injuryDays,irnd(2,10));story('Une mésaventure sur la route vous laisse blessé.')}render()}
function explore(){let L=loc(game.placeId),chance=clamp(.25+game.stats.intelligence*.012+game.stats.agility*.015+game.skills.survival*.012-(1-L.safety)*.28-game.needs.fatigue*.003,.04,.9);advance(irnd(1,3),'Exploration');if(Math.random()<chance){let f=pick(['une plante médicinale','une trace récente','une cache oubliée','un lieu oublié','un voyageur blessé','un itinéraire plus sûr']);story('Exploration : vous découvrez '+f+'.');if(f.includes('plante')){game.skills.medicine=clamp(game.skills.medicine+rnd(.1,.5));game.health=clamp(game.health+3)}if(f.includes('cache'))game.money+=irnd(3,25)}else{story('Vous ne trouvez rien de certain.');if(Math.random()<(1-L.safety)*.1){game.health=clamp(game.health-rnd(5,18));story('Le terrain vous blesse.')}}}
function rumor(){let n=pick(game.npcs.filter(x=>x.alive)),conf=clamp(.35+game.stats.intelligence*.02+game.stats.reputation*.003,.1,.95);story(`Vous écoutez ${n.name}. Fiabilité estimée : ${Math.round(conf*100)}%.`);if(Math.random()<conf)game.rumors.unshift(`Une piste concerne ${pick(LOCS).name}.`);game.rumors=game.rumors.slice(0,8);advance(1,'Vous passez du temps à écouter.');}
function duel(n){let p=game.stats,e=n.stats;let fatigue=Math.max(.35,1-game.needs.fatigue/140),atk=(p.force*.42+p.agility*.22+p.spirit*.24+p.intelligence*.12+game.skills.combat*1.5)*fatigue,def=(p.constitution*.36+p.agility*.34+p.spirit*.2+p.intelligence*.1+game.skills.combat*1.2)*fatigue,enemy=e.force*.4+e.agility*.25+e.spirit*.2+e.constitution*.15+n.skill*1.5,odds=clamp(.5+(atk+def-enemy*2)/100,.07,.93);if(Math.random()<odds){game.stats.reputation=clamp(game.stats.reputation+rnd(2,6),-100,100);game.skills.combat=clamp(game.skills.combat+rnd(.12,.4),0,20);story(`Vous remportez votre duel contre ${n.name}.`)}else{game.stats.reputation=clamp(game.stats.reputation-rnd(1,5),-100,100);game.health=clamp(game.health-rnd(4,16));game.injury=clamp(game.injury+rnd(4,18));game.injuryDays=Math.max(game.injuryDays,irnd(2,11));story(`${n.name} vous domine. La défaite laisse une trace.`)} }
function opportunity(){let kind=pick(['livraison','escorte','collecte','recherche','soin']),gain=irnd(4,24)+Math.max(0,Math.round(game.stats.reputation/10));if(kind==='escorte'&&game.stats.agility<5&&Math.random()<.35){game.injury=clamp(game.injury+10);game.health=clamp(game.health-4);story('La mission d’escorte était plus dangereuse que prévu.')}else{game.money+=gain;game.stats.reputation=clamp(game.stats.reputation+rnd(.3,1.8),-100,100);story(`La mission de ${kind} rapporte ${gain} pièces.`)}}
function choose(i){let cs=currentChoices(),x=cs[i];if(!x||game.dead)return;x[2]?.();story(x[0]+' : '+x[1]);advance(x[3],x[4])}
function currentChoices(){if(!game||game.dead)return[];let here=game.npcs.filter(n=>n.alive&&n.placeId===game.placeId),o=[];if(game.age<7)o=[['Observer les adultes','Apprendre sans forcer votre corps.',()=>game.stats.intelligence=clamp(game.stats.intelligence+.03),1,'Observer'],['Jouer avec les enfants','Créer les premières relations.',()=>{let n=pick(here)||pick(game.npcs);n.relation=clamp(n.relation+2,-100,100)},1,'Jouer'],['Rester auprès de la famille','La sécurité compte plus que l’aventure.',()=>game.needs.fatigue=clamp(game.needs.fatigue-3),2,'Famille']];else if(game.age<13)o=[['Aider un artisan','Apprendre un métier.',()=>game.skills.craft=clamp(game.skills.craft+.18),2,'Artisan'],['Observer un pratiquant','Comprendre respiration et maîtrise.',()=>game.skills.scholar=clamp(game.skills.scholar+.08),1,'Observer'],['Accompagner au marché','Découvrir l’économie locale.',()=>game.money+=1,1,'Marché']];else{o=[['Parler à quelqu’un','Une conversation peut devenir une amitié ou une dette.',()=>talkNpc(),1,'Conversation'],['Chercher un maître','Les maîtres sont rares et pas toujours fiables.',()=>game.stats.reputation=clamp(game.stats.reputation+.3,-100,100),3,'Recherche'],['Chercher une mission','Travail, escorte, commerce ou danger.',()=>opportunity(),2,'Mission'],['Suivre une rumeur','Une piste peut cacher une histoire.',()=>rumor(),2,'Rumeur']];if(here.length)o.push(['Proposer un duel','Mettre vos capacités à l’épreuve.',()=>duel(pick(here)),1,'Duel'])}return o.slice(0,6)}
function talkNpc(){let list=game.npcs.filter(n=>n.alive&&n.placeId===game.placeId);if(!list.length)return;let n=pick(list);n.relation=clamp(n.relation+rnd(1,5),-100,100);story(`${n.name} accepte de parler avec vous. Relation : ${n.relation}.`);if(Math.random()<.22){game.rumors.unshift(`${n.name} parle d’un déplacement vers ${pick(LOCS).name}.`);game.rumors=game.rumors.slice(0,8)}}
function act(type){if(!game||game.dead)return;if(type==='eat'){if(game.food>0){game.food--;game.needs.hunger=clamp(game.needs.hunger-35);game.health=clamp(game.health+1);advance(1,'Repas')}else story('Vous n’avez rien à manger.');return}if(type==='drink'){if(game.water>0){game.water--;game.needs.thirst=clamp(game.needs.thirst-40);advance(1,'Pause pour boire')}else story('Votre réserve d’eau est vide.');return}if(type==='sleep'){game.needs.sleep=clamp(game.needs.sleep-38);game.needs.fatigue=clamp(game.needs.fatigue-34);game.health=clamp(game.health+2);advance(1,'Vous dormez et récupérez.');return}if(type==='train')train();if(type==='work')work();if(type==='travel')travel();if(type==='explore')explore()}
function travelTo(id){if(id===game.placeId)return;let dest=loc(id),cur=loc(game.placeId),days=Math.max(1,Math.round(rnd(2,10)*cur.travel*dest.travel/((1.15+game.stats.agility/100)*(1-game.needs.fatigue/250))));game.placeId=id;advance(days,`Déplacement vers ${dest.name} (${days} jours).`);story(`Vous arrivez à ${dest.name}.`);render()}
function render(){if(!game)return;let L=loc(game.placeId);document.getElementById('identityTitle').textContent=game.dead?'Derniers instants':'Personnage';document.getElementById('identity').innerHTML=`<div class="hero"><b>${game.name}</b><div class="sub">${game.sex} · ${game.age} ans · ${L.name}</div><div class="row"><span class="pill">${game.dead?'☠ Mort':'● Vivant'}</span><span class="pill">${L.terrain}</span><span class="pill">${game.money} pièces</span></div></div>`;let defs=[['force','Force',''],['spirit','Esprit','purple'],['constitution','Constitution','green'],['agility','Agilité','blue'],['intelligence','Intelligence',''],['reputation','Réputation','']];document.getElementById('stats').innerHTML=defs.map(([k,n,cl])=>{let min=k==='reputation'?-100:0,max=k==='reputation'?100:30,w=clamp((game.stats[k]-min)/(max-min)*100);return`<div class="stat"><div class="statline"><span>${n}</span><b>${game.stats[k].toFixed(1)}</b></div><div class="bar ${cl}"><i style="width:${w}%"></i></div></div>`}).join('');document.getElementById('needs').innerHTML=`<div class="statline"><span>Santé</span><b>${game.health.toFixed(0)}</b></div><div class="bar green"><i style="width:${game.health}%"></i></div><div class="sub">Faim ${game.needs.hunger.toFixed(0)} · Soif ${game.needs.thirst.toFixed(0)} · Sommeil ${game.needs.sleep.toFixed(0)} · Fatigue ${game.needs.fatigue.toFixed(0)}</div>${game.injury>0?`<div class="dangerline bad" style="margin-top:7px">Blessure ${game.injury.toFixed(0)} · récupération ${game.injuryDays} j</div>`:''}`;document.getElementById('resources').innerHTML=`Nourriture : <b>${game.food}</b> · Eau : <b>${game.water}</b><br><span class="sub">Combat ${game.skills.combat.toFixed(1)} · Survie ${game.skills.survival.toFixed(1)} · Médecine ${game.skills.medicine.toFixed(1)} · Métier ${game.skills.craft.toFixed(1)}</span>`;document.getElementById('date').textContent=`${dateLabel()} · ${L.region}`;document.getElementById('story').innerHTML=game.events.map(e=>`<div class="entry"><div class="day">Jour ${e.day}</div>${e.text}</div>`).join('');let cs=currentChoices();document.getElementById('choices').innerHTML=cs.map((x,i)=>`<button class="choice" onclick="choose(${i})"><b>${x[0]}</b><span class="sub">${x[1]}</span></button>`).join('');document.getElementById('statusPills').innerHTML=`<span class="pill">QI ${game.qi.toFixed(0)}</span><span class="pill">Prospérité ${game.world.prosperity.toFixed(0)}</span>`;document.getElementById('world').innerHTML=`<div class="section"><b>${L.name}</b><div class="sub">${L.region} · sécurité ${(L.safety*100).toFixed(0)}%</div></div><div class="section">Guerre ${game.world.warLevel.toFixed(0)} · banditisme ${game.world.banditry.toFixed(0)} · maladie ${game.world.plague.toFixed(0)}</div>`;document.getElementById('nearby').innerHTML=LOCS.filter(x=>x.id!==L.id).slice(0,6).map(x=>`<div class="location" onclick="travelTo('${x.id}')"><b>${x.name}</b><div class="sub">${x.terrain} · sécurité ${(x.safety*100).toFixed(0)}%</div></div>`).join('');let rel=game.npcs.filter(n=>n.alive&&n.placeId===game.placeId).sort((a,b)=>b.relation-a.relation).slice(0,7);document.getElementById('relations').innerHTML=rel.length?rel.map(n=>`<div class="npc"><div class="between"><b>${n.name}</b><span class="pill">${n.relation}</span></div><div class="sub">${n.role} · ${n.age} ans · ${n.status}<br>${n.history}</div></div>`).join(''):'<div class="sub">Aucune relation connue ici.</div>';document.getElementById('factions').innerHTML=game.factions.map(f=>`<div class="faction"><div class="between"><b>${f.name}</b><span class="pill">${f.rep.toFixed(1)}</span></div><div class="sub">${f.stance}</div></div>`).join('');document.getElementById('rumors').innerHTML=game.rumors.length?game.rumors.slice(0,5).map(x=>`<div class="quest">${x}</div>`).join(''):'<div class="sub">Aucune rumeur enregistrée.</div>';document.getElementById('journal').innerHTML=(game.journal||[]).slice(0,10).map(x=>`<div class="sub">${x}</div>`).join('')}
function saveGame(){if(!game)return;localStorage.setItem(KEY,JSON.stringify(game));log('Sauvegarde effectuée.');render()}function loadGame(){let raw=localStorage.getItem(KEY);if(!raw){openCreation();return}try{game=JSON.parse(raw);story('Sauvegarde chargée.');render()}catch(e){openCreation()}}function toggleFull(){if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('app').requestFullscreen().catch(()=>{})}function showModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}makeGame();document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key.toLowerCase()==='f')toggleFull();if(e.key>='1'&&e.key<='6')choose(+e.key-1)});
</script>
</body>
</html>
