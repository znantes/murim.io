<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murim — Simulation vivante</title>
<style>
:root{--bg:#090b10;--panel:#11151d;--panel2:#171d27;--line:#293241;--text:#e9edf3;--muted:#9aa5b5;--accent:#caa86a;--danger:#d66b6b;--ok:#79b88b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18202b 0,#090b10 45%);color:var(--text);font:15px system-ui,Segoe UI,sans-serif;min-height:100vh}button{background:#1b2330;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 13px;cursor:pointer}button:hover{border-color:var(--accent);transform:translateY(-1px)}button.primary{background:#80663d;border-color:#a88a58}.app{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}.title{font-size:28px;font-weight:750}.sub{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:7px}.grid{display:grid;grid-template-columns:280px 1fr 320px;gap:14px}.panel{background:linear-gradient(180deg,#121720,#0f131a);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 12px 35px #0005}.panel h2,.panel h3{margin:0 0 10px}.stat{margin:10px 0}.statline{display:flex;justify-content:space-between}.bar{height:7px;background:#252c37;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.center{min-height:720px}.chronicle{height:410px;overflow:auto;background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:14px}.event{padding:10px 0;border-bottom:1px solid #202631}.event small{color:var(--muted)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.choice{text-align:left;min-height:58px}.tag{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px;margin:2px}.danger{color:var(--danger)}.ok{color:var(--ok)}.npc{padding:9px;border-bottom:1px solid #202631}.npc b{display:block}.small{font-size:12px;color:var(--muted)}.log{max-height:230px;overflow:auto}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{max-width:720px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}@media(max-width:1050px){.grid{grid-template-columns:1fr}.center{min-height:0}.choices{grid-template-columns:1fr}}:fullscreen .app{max-width:none}
</style></head>
<body><div class="app" id="app"><header class="top"><div><div class="title">MURIM</div><div class="sub">Simulation vivante — personne n'est le héros du monde</div></div><div class="actions"><button class="primary" onclick="newLife()">Nouvelle vie</button><button onclick="randomLife()">Vie aléatoire</button><button onclick="saveGame()">Sauvegarder</button><button onclick="loadGame()">Charger</button><button onclick="toggleFull()">⛶ Agrandir</button></div></header>
<div class="grid"><aside class="panel"><h2>Personnage</h2><div id="identity"></div><h3>Attributs</h3><div id="stats"></div><h3>État</h3><div id="needs"></div><div class="actions"><button onclick="act('train')">S'entraîner</button><button onclick="act('travel')">Voyager</button><button onclick="act('rest')">Se reposer</button><button onclick="act('observe')">Observer</button></div></aside>
<main class="panel center"><h2>Chronique actuelle</h2><div class="sub" id="date"></div><div class="chronicle" id="chronicle"></div><div class="choices" id="choices"></div></main>
<aside class="panel"><h2>Monde</h2><div id="world"></div><h3>PNJ proches</h3><div id="npcs"></div><h3>Journal</h3><div class="log" id="log"></div></aside></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalBody"></div><button onclick="closeModal()">Fermer</button></div></div>
<script>
const KEY='murim_html_v1';let game=null;
const names=['Han Jiwon','Seo Mira','Baek Hyeon','Yun Ara','Kang Min','Jin Seol','Mu Ryu','Choi Nara','Park Dojin','Im Sora'];
const places=['Village de Qinghe','Plaines du Nord','Forêt des Pins Noirs','Cité de Hanyang','Monts du Ciel','Vallée de Jade'];
function r(a,b){return Math.random()*(b-a)+a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x))}
function newLife(random=false){game={day:1,year:0,dead:false,place:pick(places),name:pick(names),age:random?Math.floor(r(14,35)):0,sex:Math.random()<.5?'Homme':'Femme',stats:{force:r(1,8),esprit:r(1,8),constitution:r(1,8),agilite:r(1,8),intelligence:r(1,8),reputation:0},needs:{faim:r(0,15),soif:r(0,15),sommeil:r(0,15),fatigue:r(0,10)},health:100,qi:20,relations:{},npcs:[],events:[],world:{war:false,season:'Printemps',prosperity:55,rumors:[]},choices:[]};for(let i=0;i<7;i++)game.npcs.push(makeNpc());log('Une nouvelle vie commence.');event(random?'Le hasard vous place dans le monde.':'Vous êtes né dans un monde immense, sans destin garanti.');render()}
function makeNpc(){let s={force:r(1,15),esprit:r(1,15),constitution:r(1,15),agilite:r(1,15),intelligence:r(1,15),reputation:r(-20,20)};return{id:crypto.randomUUID(),name:pick(names),age:Math.floor(r(8,65)),place:game?.place||pick(places),alive:true,stats:s,relation:Math.floor(r(-10,15)),role:pick(['paysan','marchand','garde','médecin','disciple','voyageur','bandit'])}}
function event(text){game.events.unshift({day:game.day,text});if(game.events.length>80)game.events.pop()}
function log(text){if(!game)return;game._log??=[];game._log.unshift(`[J${game.day}] ${text}`);game._log=game._log.slice(0,50)}
function advance(days=1){if(!game||game.dead)return;for(let d=0;d<days;d++){game.day++;game.age=game.day<365?game.age:game.age+1;game.needs.faim=clamp(game.needs.faim+.7);game.needs.soif=clamp(game.needs.soif+1);game.needs.sommeil=clamp(game.needs.sommeil+.55);game.needs.fatigue=clamp(game.needs.fatigue+.35);game.npcs.forEach(n=>{if(n.alive){n.age+=Math.random()<1/365?1:0;n.stats.reputation=clamp(n.stats.reputation*(.999));if(Math.random()<.004)n.alive=false}});if(Math.random()<.025){game.world.prosperity=clamp(game.world.prosperity+r(-8,8),0,100);let e=pick(['Une caravane arrive','Une rumeur circule','Des bandits sont signalés','Un marchand recherche un garde','Un maître itinérant traverse la région','Une maladie touche quelques foyers']);event(e);log(e)}if(game.needs.faim>95||game.needs.soif>95||game.needs.fatigue>97){game.health=clamp(game.health-.8,0,100);if(game.health<=0){game.dead=true;event('Votre corps ne supporte plus les privations. Votre vie s’achève.');log('Vous êtes mort.')}}}render()}
function assessTraining(){let s=game.stats,age=game.age;let readiness=s.constitution*.55+s.esprit*.25+s.agilite*.2;let control=s.esprit*.55+s.intelligence*.25+s.constitution*.2;let intensity=clamp(r(.35,.9),0,1);let success=clamp(.30+readiness*.025+control*.015-intensity*.30-(age<8?.35:age<13?.15:age>55?.12:0),.03,.97);let injury=clamp(intensity*.48+Math.max(0,5-s.constitution)*.045,.01,.92);return{success,injury,intensity}}
function act(type){if(!game||game.dead)return;if(type==='rest'){game.needs.fatigue=clamp(game.needs.fatigue-25);game.needs.sommeil=clamp(game.needs.sommeil-20);advance(1);event('Vous consacrez du temps à récupérer.');return}if(type==='travel'){let dist=r(1,6);let days=Math.max(1,Math.round(dist*(1.25-game.stats.agilite/100)* (1+game.needs.fatigue/150)));game.place=pick(places);game.needs.fatigue=clamp(game.needs.fatigue+days*2);advance(days);event(`Le voyage vers ${game.place} prend ${days} jour(s).`);return}if(type==='observe'){let n=pick(game.npcs.filter(x=>x.alive));let confidence=clamp(.45+game.stats.intelligence*.025+game.stats.esprit*.01,0,1);event(`Vous observez ${n.name}. Fiabilité de votre lecture : ${Math.round(confidence*100)}%.`);return}if(type==='train'){let a=assessTraining();game.needs.fatigue=clamp(game.needs.fatigue+18);advance(1);if(Math.random()<a.injury){game.health=clamp(game.health-r(5,25));event('L’entraînement tourne mal : blessure et récupération nécessaires.');log('Blessure pendant l’entraînement.')}else if(Math.random()<a.success){let k=pick(['force','esprit','constitution','agilite','intelligence']);game.stats[k]=clamp(game.stats[k]+r(.05,.35));event(`Votre entraînement produit un progrès discret en ${k}.`)}else event('Vous vous entraînez, mais le résultat est faible. La régularité compte davantage qu’un effort isolé.');render()}}
function choice(i){let c=game.choices[i];if(!c)return;game.choices=[];event(c.result);if(c.effect)c.effect();advance(c.days||1)}
function makeChoices(){if(!game||game.dead)return[];let out=[];if(game.age<8)out=[{t:'Observer les adultes',result:'Vous apprenez surtout en regardant.',days:1},{t:'Jouer avec les autres enfants',result:'Une relation d’enfance se forme.',days:1}];else if(game.age<13)out=[{t:'Aider un artisan',result:'Vous découvrez qu’un métier peut compter autant que le combat.',days:2},{t:'Suivre un entraînement léger',result:'Le corps apprend, mais il est encore fragile.',days:1}];else out=[{t:'Accepter une petite mission',result:'Une tâche banale vous met en contact avec d’autres personnes.',days:2},{t:'Chercher un maître',result:'Les maîtres ne sont pas tous dignes de confiance.',days:3},{t:'Travailler pour vivre',result:'Vous gagnez peu, mais votre réputation locale peut changer.',days:7},{t:'Explorer hors des routes',result:'Vous trouvez peut-être quelque chose… ou quelqu’un vous trouve.',days:3}];return out}
function render(){if(!game)return;document.getElementById('identity').innerHTML=`<b>${game.name}</b><div class="small">${game.sex} · ${game.age} ans · ${game.place}</div>${game.dead?'<span class="tag danger">DÉCÉDÉ</span>':'<span class="tag ok">Vivant</span>'}`;let defs=[['force','Force'],['esprit','Esprit'],['constitution','Constitution'],['agilite','Agilité'],['intelligence','Intelligence'],['reputation','Réputation']];document.getElementById('stats').innerHTML=defs.map(([k,n])=>`<div class="stat"><div class="statline"><span>${n}</span><b>${game.stats[k].toFixed(1)}</b></div><div class="bar"><i style="width:${clamp((game.stats[k]+(k==='reputation'?100:0))/(k==='reputation'?200:20)*100)}%"></i></div></div>`).join('');document.getElementById('needs').innerHTML=`Santé <b>${game.health.toFixed(0)}</b><br>Faim ${game.needs.faim.toFixed(0)} · Soif ${game.needs.soif.toFixed(0)} · Sommeil ${game.needs.sommeil.toFixed(0)} · Fatigue ${game.needs.fatigue.toFixed(0)}`;document.getElementById('date').textContent=`Jour ${game.day} · ${game.world.season} · prospérité ${game.world.prosperity.toFixed(0)}`;document.getElementById('chronicle').innerHTML=game.events.map(e=>`<div class="event"><small>Jour ${e.day}</small><br>${e.text}</div>`).join('');let cs=makeChoices();game.choices=cs;document.getElementById('choices').innerHTML=cs.map((c,i)=>`<button class="choice" onclick="choice(${i})">${c.t}</button>`).join('');document.getElementById('world').innerHTML=`<div class="tag">${game.place}</div><div class="small">Les PNJ vieillissent, voyagent, travaillent et peuvent mourir sans vous attendre.</div>`;document.getElementById('npcs').innerHTML=game.npcs.filter(n=>n.alive&&n.place===game.place).slice(0,8).map(n=>`<div class="npc"><b>${n.name}</b><span class="small">${n.role} · ${n.age} ans · relation ${n.relation}</span></div>`).join('')||'<div class="small">Personne de connu ici.</div>';document.getElementById('log').innerHTML=(game._log||[]).map(x=>`<div class="small">${x}</div>`).join('')}
function saveGame(){if(!game)return;localStorage.setItem(KEY,JSON.stringify(game));log('Sauvegarde effectuée.');render()}function loadGame(){let x=localStorage.getItem(KEY);if(!x)return;game=JSON.parse(x);log('Sauvegarde chargée.');render()}function randomLife(){newLife(true)}function toggleFull(){document.fullscreenElement?document.exitFullscreen():document.getElementById('app').requestFullscreen()}function closeModal(){document.getElementById('modal').classList.remove('show')}document.addEventListener('keydown',e=>{if(e.key==='f')toggleFull();if(e.key===' '){e.preventDefault();advance(1)}});newLife();
</script></body></html>
