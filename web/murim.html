<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murim — Monde vivant</title>
<style>
:root{--bg:#080a0f;--p:#111722;--p2:#171f2c;--line:#2a3444;--txt:#edf1f5;--muted:#98a5b6;--gold:#c9a76a;--red:#c96d6d;--green:#79b693;--blue:#79a6d0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#080a0f,#111722 55%,#080a0f);color:var(--txt);font:14px Inter,system-ui,Segoe UI,sans-serif}.app{max-width:1600px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.brand{font-size:29px;font-weight:800;letter-spacing:.12em}.muted,.small{color:var(--muted)}.small{font-size:12px}.toolbar,.row{display:flex;gap:7px;flex-wrap:wrap}button,select{background:#192332;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px}button{cursor:pointer}button:hover{border-color:var(--gold)}button.gold{background:#725b35;border-color:#a78650}.grid{display:grid;grid-template-columns:290px minmax(420px,1fr) 340px;gap:12px}.panel{background:linear-gradient(180deg,#121924,#0e131b);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:0 16px 40px #0004}.panel h2{margin:0 0 8px}.panel h3{margin:15px 0 7px}.center{min-height:calc(100vh - 90px)}.story{height:440px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:#0a0e14;padding:13px}.ev{border-bottom:1px solid #202835;padding:9px 0}.ev b{color:#e7d3a8}.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.choice{text-align:left;min-height:64px}.stat{margin:9px 0}.statline{display:flex;justify-content:space-between}.bar{height:6px;background:#252d39;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--gold)}.meter{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin:2px;color:var(--muted);font-size:11px}.good{color:var(--green)}.bad{color:var(--red)}.info{color:var(--blue)}.card{background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:9px;margin:7px 0}.npc{display:flex;justify-content:space-between;gap:6px}.map{display:grid;grid-template-columns:1fr 1fr;gap:6px}.loc{padding:10px;border:1px solid var(--line);border-radius:8px;background:#101722}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:15px}.modal.show{display:grid}.modal>div{max-width:760px;width:100%;background:var(--p);border:1px solid var(--line);border-radius:12px;padding:18px;max-height:85vh;overflow:auto}@media(max-width:1100px){.grid{grid-template-columns:1fr}.center{min-height:0}.choices{grid-template-columns:1fr}}
</style></head>
<body><div class="app" id="app"><div class="top"><div><div class="brand">MURIM</div><div class="muted">Un monde où des milliers de vies avancent sans attendre le joueur.</div></div><div class="toolbar"><button class="gold" onclick="newGame()">Nouvelle vie</button><button onclick="randomLife()">Destin aléatoire</button><button onclick="saveGame()">Sauver</button><button onclick="loadGame()">Charger</button><button onclick="full()">⛶ Plein écran</button></div></div>
<div class="grid"><aside class="panel"><h2>Votre vie</h2><div id="hero"></div><h3>Attributs</h3><div id="stats"></div><h3>État</h3><div id="needs"></div><h3>Actions</h3><div class="row"><button onclick="action('rest')">Dormir</button><button onclick="action('work')">Travailler</button><button onclick="action('train')">Entraîner</button><button onclick="action('travel')">Voyager</button><button onclick="action('explore')">Explorer</button><button onclick="action('rumor')">Écouter</button></div></aside>
<main class="panel center"><h2>Chronique</h2><div class="small" id="clock"></div><div class="story" id="story"></div><div class="choices" id="choices"></div></main>
<aside class="panel"><h2>Monde</h2><div id="world"></div><h3>Personnes</h3><div id="npcs"></div><h3>Factions connues</h3><div id="factions"></div><h3>Inventaire</h3><div id="inv"></div></aside></div></div>
<div class="modal" id="modal"><div><h2 id="mt"></h2><div id="mb"></div><button onclick="closeModal()">Fermer</button></div></div>
<script>
const KEY='murim_best_html_v2';let g=null;
const names=['Han Jiwon','Seo Mira','Baek Hyeon','Yun Ara','Kang Min','Jin Seol','Mu Ryu','Choi Nara','Park Dojin','Im Sora','Li Ren','Shen Yue'];
const regions=[{n:'Village de Qinghe',kind:'village',risk:10},{n:'Plaines du Nord',kind:'route',risk:24},{n:'Forêt des Pins Noirs',kind:'wilderness',risk:45},{n:'Cité de Hanyang',kind:'city',risk:12},{n:'Monts du Ciel',kind:'mountains',risk:60},{n:'Vallée de Jade',kind:'valley',risk:30}];
const factionNames=['Alliance orthodoxe','Grande famille','Académie','Palais extérieur','Marchands des Routes','Culte démoniaque'];
const roles=['paysan','marchand','garde','médecin','artisan','disciple','voyageur','bandit','érudit'];
const techniques=[['Posture du Pilier','constitution',1.1],['Pas de l’Ombre Courte','agilite',1.0],['Poing des Huit Montagnes','force',1.0],['Respiration du Fil d’Argent','esprit',1.2],['Lecture des Méridiens','intelligence',1.1]];
function rnd(a,b){return Math.random()*(b-a)+a}function pick(a){return a[Math.floor(Math.random()*a.length)]}function c(v,a=0,b=100){return Math.max(a,Math.min(b,v))}function dayLabel(){return 'Jour '+g.day+' · '+(Math.floor((g.day-1)/90)%4===0?'Printemps':Math.floor((g.day-1)/90)%4===1?'Été':Math.floor((g.day-1)/90)%4===2?'Automne':'Hiver')}
function newGame(random=false){g={day:1,name:pick(names),sex:Math.random()<.5?'Homme':'Femme',age:random?Math.floor(rnd(16,32)):0,place:pick(regions).n,health:100,death:false,money:random?Math.floor(rnd(10,70)):0,stats:{force:rnd(1,8),esprit:rnd(1,8),constitution:rnd(1,8),agilite:rnd(1,8),intelligence:rnd(1,8),reputation:0},needs:{hunger:rnd(0,12),thirst:rnd(0,12),sleep:rnd(0,8),fatigue:rnd(0,8)},qi:10,inventory:['Vêtements simples','Eau'],tech:[],friends:{},factions:Object.fromEntries(factionNames.map(x=>[x,0])),npcs:[],events:[],world:{prosperity:55,war:false,rumors:[],masters:0},choices:[]};for(let i=0;i<10;i++)g.npcs.push(makeNpc());if(random){g.tech=[pick(techniques)[0]];g.money+=20}push('Votre vie commence. Vous n’êtes ni élu, ni protégé par le destin.');push(random?'Vous entrez dans le monde à l’âge adulte.':'Vous êtes né dans une famille ordinaire, quelque part dans le Murim.');render()}
function makeNpc(){let f={force:rnd(1,18),esprit:rnd(1,18),constitution:rnd(1,18),agilite:rnd(1,18),intelligence:rnd(1,18),reputation:rnd(-25,25)};return{id:Math.random().toString(36).slice(2),name:pick(names),age:Math.floor(rnd(8,70)),role:pick(roles),place:g?g.place:pick(regions).n,alive:true,stats:f,rel:Math.floor(rnd(-10,10)),faction:pick(factionNames)}}
function push(t){g.events.unshift({d:g.day,t});if(g.events.length>120)g.events.pop()}function note(t){g.log??=[];g.log.unshift('J'+g.day+' — '+t);g.log=g.log.slice(0,40)}
function tick(days=1){if(!g||g.death)return;for(let i=0;i<days;i++){g.day++;g.age+=g.day%365===1?1:0;g.needs.hunger=c(g.needs.hunger+.65);g.needs.thirst=c(g.needs.thirst+.95);g.needs.sleep=c(g.needs.sleep+.5);g.needs.fatigue=c(g.needs.fatigue+.3);for(const n of g.npcs)if(n.alive){if(Math.random()<0.01)n.age++;if(Math.random()<0.002)n.alive=false;if(Math.random()<0.02)n.place=pick(regions).n}g.world.prosperity=c(g.world.prosperity+rnd(-1.8,1.8));if(Math.random()<.035){let e=pick(['Une caravane arrive.','Une rumeur sur un maître itinérant circule.','Des bandits sont recherchés.','Un tournoi local est annoncé.','Une maladie apparaît dans un quartier.','Une maison noble recrute des talents.','Une secte envoie des émissaires.']);push(e);note(e)}if(Math.random()<.008){g.world.war=!g.world.war;push(g.world.war?'Une tension armée dégénère en conflit.':'Le conflit se calme provisoirement.')}if(g.needs.hunger>97||g.needs.thirst>97||g.needs.fatigue>98){g.health=c(g.health-.7);if(g.health<=0){g.death=true;push('Votre santé s’effondre sous les privations. Votre vie s’achève.');note('Mort du personnage')}}}render()}
function training(){let s=g.stats,age=g.age;let body=s.constitution*.55+s.agilite*.2+s.esprit*.25;let ctrl=s.esprit*.55+s.intelligence*.25+s.constitution*.2;let intensity=rnd(.35,.9);let success=c(.28+body*.026+ctrl*.016-intensity*.3-(age<8?.35:age<13?.15:age>55?.12:0),.03,.96);let injury=c(intensity*.5+Math.max(0,5-s.constitution)*.04+g.needs.fatigue*.004,.01,.9);return{success,injury}}
function action(type){if(!g||g.death)return;if(g.age<8&&['train','travel','work'].includes(type)){push('À votre âge, cette activité reste largement hors de portée. Vous dépendez encore des adultes.');tick(1);return}if(type==='rest'){g.needs.fatigue=c(g.needs.fatigue-28);g.needs.sleep=c(g.needs.sleep-32);g.needs.hunger=c(g.needs.hunger+2);tick(1);push('Vous prenez une journée de récupération.');return}if(type==='work'){let gain=Math.max(1,Math.round(rnd(2,8)+g.stats.intelligence*.25));g.money+=gain;g.needs.fatigue=c(g.needs.fatigue+14);g.stats.reputation=c(g.stats.reputation+rnd(.05,.5),-100,100);tick(rndInt(1,4));push('Vous travaillez honnêtement et gagnez '+gain+' pièces.');return}if(type==='travel'){let dest=pick(regions);let d=Math.max(1,Math.round(rnd(2,8)*(1-g.stats.agilite/160)*(1+g.needs.fatigue/130)));g.place=dest.n;g.needs.fatigue=c(g.needs.fatigue+d*2.2);tick(d);push('Le voyage vers '+dest.n+' vous coûte '+d+' jour(s). Le monde ne se déplace pas instantanément.');return}if(type==='explore'){let reg=regions.find(x=>x.n===g.place)||regions[0];let chance=c(.25+g.stats.agilite*.025+g.stats.intelligence*.015-reg.risk*.004-g.needs.fatigue*.003,.04,.9);tick(1);if(Math.random()<chance){let e=pick(['Vous trouvez une piste ancienne.','Vous rencontrez un voyageur blessé.','Vous découvrez une cache oubliée.','Vous remarquez un itinéraire plus sûr.','Vous trouvez des plantes médicinales.']);push(e);if(e.includes('cache'))g.inventory.push('Petit trésor');}else{push('Votre exploration ne produit rien de notable.');if(Math.random()<reg.risk/150){g.health=c(g.health-rnd(5,18));push('Le terrain vous blesse.')}}return}if(type==='rumor'){let reliable=c(.45+g.stats.intelligence*.025+g.stats.esprit*.012,0.1,.95);let n=pick(g.npcs.filter(x=>x.alive));push('Vous écoutez '+n.name+'. Fiabilité estimée : '+Math.round(reliable*100)+'%.');if(Math.random()<reliable)g.world.rumors.push('Information partiellement fiable entendue au jour '+g.day);tick(1);return}if(type==='train'){let a=training();g.needs.fatigue=c(g.needs.fatigue+18);tick(1);if(Math.random()<a.injury){g.health=c(g.health-rnd(6,24));push('Votre entraînement provoque une blessure.');note('Blessure');}else if(Math.random()<a.success){let k=pick(['force','esprit','constitution','agilite','intelligence']);let amount=rnd(.04,.28)*(1+g.stats.intelligence*.012);g.stats[k]=c(g.stats[k]+amount,0,100);if(Math.random()<.18&&g.tech.length<3)g.tech.push(pick(techniques)[0]);push('Progression lente : '+k+' +'+amount.toFixed(2)+'.');}else push('Vous avez travaillé, mais le corps ne progresse presque pas.');return}}
function rndInt(a,b){return Math.floor(rnd(a,b+1))}
function combat(n){let p=g.stats,e=n.stats;let fatigue=c(1-g.needs.fatigue/140,.35,1);let atk=(p.force*.42+p.agilite*.22+p.esprit*.24+p.intelligence*.12)*fatigue;let def=(p.constitution*.36+p.agilite*.34+p.esprit*.2+p.intelligence*.1)*fatigue;let enemy=e.force*.4+e.agilite*.25+e.esprit*.2+e.constitution*.15;let odds=c(.5+(atk+def-enemy*2)/100,.05,.95);return{odds,won:Math.random()<odds}}
function makeChoices(){if(g.death)return[];let out=[];if(g.age<8)out=[['Regarder les adultes','Vous apprenez en silence en observant les gestes du quotidien.',1],['Jouer dehors','Une amitié d’enfance peut durer longtemps.',1]];else if(g.age<13)out=[['Aider un artisan','Une compétence non martiale peut devenir votre avenir.',2],['Accepter un entraînement léger','Vous découvrez vos limites physiques.',1],['Suivre un autre enfant','Une petite aventure commence.',1]];else out=[['Chercher du travail','L’argent et la réputation locale comptent.',3],['Chercher un maître','Les maîtres ne sont ni nombreux ni tous fiables.',3],['Entrer dans un tournoi local','Votre adversaire sera peut-être simplement meilleur que vous.',2],['Approcher une faction','Une porte s’ouvre pendant qu’une autre peut se fermer.',2]];return out.map(x=>({t:x[0],r:x[1],d:x[2]}))}
function choose(i){let x=g.choices[i];if(!x)return;g.choices=[];if(x.t.includes('tournoi')){let n=pick(g.npcs.filter(n=>n.alive));let res=combat(n);push(res.won?'Vous remportez difficilement votre duel contre '+n.name+'.':'Votre adversaire '+n.name+' vous surclasse. Vous quittez le terrain blessé ou humilié.');if(!res.won){g.health=c(g.health-rnd(2,15));g.stats.reputation=c(g.stats.reputation-rnd(1,5),-100,100)}else g.stats.reputation=c(g.stats.reputation+rnd(1,4),-100,100)}else if(x.t.includes('faction')){let f=pick(factionNames);g.factions[f]=c(g.factions[f]+rnd(2,8),-100,100);push('Vous nouez un premier contact avec '+f+'. Votre accès dépendra de ce que vous prouvez, pas d’un destin caché.')}else push(x.r);tick(x.d)}
function render(){if(!g)return;document.getElementById('hero').innerHTML='<b>'+g.name+'</b><div class="small">'+g.sex+' · '+g.age+' ans</div><div class="small">'+g.place+' · '+(g.death?'<span class="bad">DÉCÉDÉ</span>':'<span class="good">Vivant</span>')+'</div><span class="pill">'+g.money+' pièces</span><span class="pill">Qi '+g.qi.toFixed(0)+'</span>';
let defs=[['force','Force'],['esprit','Esprit'],['constitution','Constitution'],['agilite','Agilité'],['intelligence','Intelligence'],['reputation','Réputation']];document.getElementById('stats').innerHTML=defs.map(([k,n])=>{let pct=k==='reputation'?(g.stats[k]+100)/2:g.stats[k]*5;return '<div class="stat"><div class="statline"><span>'+n+'</span><b>'+g.stats[k].toFixed(1)+'</b></div><div class="bar"><span style="width:'+c(pct)+'%"></span></div></div>'}).join('');document.getElementById('needs').innerHTML='<div class="meter"><div>❤️ '+g.health.toFixed(0)+'</div><div>🍚 '+g.needs.hunger.toFixed(0)+'</div><div>💧 '+g.needs.thirst.toFixed(0)+'</div><div>😴 '+g.needs.sleep.toFixed(0)+'</div><div>⚡ '+g.needs.fatigue.toFixed(0)+'</div></div>';
document.getElementById('clock').textContent=dayLabel()+' · prospérité '+g.world.prosperity.toFixed(0)+(g.world.war?' · CONFLIT':'');document.getElementById('story').innerHTML=g.events.map(e=>'<div class="ev"><small>Jour '+e.d+'</small><br>'+e.t+'</div>').join('');g.choices=makeChoices();document.getElementById('choices').innerHTML=g.choices.map((x,i)=>'<button class="choice" onclick="choose('+i+')"><b>'+x.t+'</b><br><span class="small">'+x.r+'</span></button>').join('');document.getElementById('world').innerHTML='<div class="map">'+regions.map(r=>'<div class="loc"><b>'+r.n+'</b><div class="small">danger '+r.risk+'%</div></div>').join('')+'</div><div class="card"><b>Techniques</b><div class="small">'+(g.tech.length?g.tech.join(' · '):'Aucune technique connue')+'</div></div>';
document.getElementById('npcs').innerHTML=g.npcs.filter(n=>n.alive&&n.place===g.place).slice(0,8).map(n=>'<div class="card npc"><div><b>'+n.name+'</b><div class="small">'+n.role+' · '+n.age+' ans</div></div><span class="pill">rel '+n.rel+'</span></div>').join('')||'<div class="small">Aucune personne connue ici.</div>';document.getElementById('factions').innerHTML=Object.entries(g.factions).map(([k,v])=>'<div class="small">'+k+' : <b>'+v.toFixed(0)+'</b></div>').join('');document.getElementById('inv').innerHTML=g.inventory.map(x=>'<span class="pill">'+x+'</span>').join('')||'<span class="small">Vide</span>'}
function saveGame(){if(g)localStorage.setItem(KEY,JSON.stringify(g));note('Sauvegarde locale effectuée.');render()}function loadGame(){let x=localStorage.getItem(KEY);if(x){g=JSON.parse(x);note('Sauvegarde chargée.');render()}}function randomLife(){newGame(true)}function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}function closeModal(){document.getElementById('modal').classList.remove('show')}newGame();
</script></body></html>
