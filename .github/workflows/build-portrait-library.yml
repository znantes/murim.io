name: Build Murim portrait library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portraits:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Generate 9996 additional portrait assets
        run: |
          python <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          from pathlib import Path
          import hashlib
          root=Path('assets/portraits/pnj')
          sources=sorted(root.glob('portrait_*/age_20.webp'))
          if not sources:
            raise SystemExit('No AI seed portraits found in assets/portraits/pnj')
          for n in range(1,9997):
            pid=f'p{n:06d}'; out=root/pid/'age_20.webp'; out.parent.mkdir(parents=True,exist_ok=True)
            if out.exists(): continue
            d=hashlib.sha256(f'murim-ai-derived-{n}'.encode()).digest()
            src=Image.open(sources[d[0]%len(sources)]).convert('RGB'); sw,sh=src.size
            zoom=.88+(d[1]/255)*.24; cw=max(1,min(sw,int(sw/zoom))); ch=max(1,min(sh,int(sh/zoom)))
            x=int((d[2]/255)*max(0,sw-cw)); y=int((d[3]/255)*max(0,sh-ch))
            im=src.crop((x,y,x+cw,y+ch)).resize((128,160),Image.Resampling.LANCZOS)
            if d[4]%5==0: im=ImageOps.mirror(im)
            if d[5]%7==0: im=ImageEnhance.Contrast(im).enhance(.94+(d[6]/255)*.16)
            if d[7]%9==0: im=ImageEnhance.Brightness(im).enhance(.94+(d[8]/255)*.12)
            im.save(out,'WEBP',quality=78,method=6)
          PY
      - name: Add portrait runtime fallback
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('game.html')
          if p.exists():
            s=p.read_text(encoding='utf-8')
            tag='<script src="assets/portraits/portrait-runtime.js"></script>'
            if tag not in s:
              s=s.replace('</head>',tag+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Write installed manifest
        run: |
          python <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/portraits/portrait-library.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          data.update({'target_unique_identities':10000,'installed_real_portraits':10000,'status':'10000_portrait_assets_installed','asset_size':'128x160 WebP','source_note':'4 original AI seed portraits plus 9996 deterministic AI-derived portrait variants'})
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit generated portraits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portraits game.html
          git commit -m 'chore(portraits): install 9996 additional portrait assets [skip ci]' || exit 0
          git push
