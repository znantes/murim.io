name: Build Murim Windows application

on:
  push:
    branches: [main]
    paths:
      - 'app/native/**'
      - 'engine/murim_engine.cpp'
      - 'engine/murim_engine.hpp'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure clean build
        run: cmake -S app/native -B build/native -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native --config Release --parallel 2

      - name: Smoke test executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/native/Release/Murim.exe').Path
          if (-not (Test-Path $exe)) { throw 'Murim.exe introuvable' }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Smoke test echoue avec le code $($p.ExitCode)" }
          $size = (Get-Item $exe).Length
          if ($size -lt 20000) { throw "Binaire trop petit: $size octets" }
          Write-Host "Murim.exe OK - $size octets"

      - name: Validate external content
        shell: pwsh
        run: |
          $required = @(
            'assets/portraits',
            'assets/manuals',
            'assets/techniques',
            'assets/factions',
            'assets/locations',
            'assets/ui',
            'data/techniques-5000.js',
            'data/titles-5000.js',
            'data/manuals-5000.js',
            'data/portraits.json',
            'data/external-content-manifest.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Ressource externe manquante: $path" }
          }
          Write-Host 'External content structure OK'

      - name: Security metadata
        shell: pwsh
        run: |
          $exe = 'build/native/Release/Murim.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "SHA256=$hash" | Set-Content -Encoding utf8 dist-hash.txt
          Write-Host "SHA256=$hash"
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "Authenticode=$($sig.Status)"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'build/native/Release/Murim.exe' 'dist/Murim.exe'
          Copy-Item 'dist-hash.txt' 'dist/SHA256.txt'
          Copy-Item 'assets' 'dist/assets' -Recurse -Force
          Copy-Item 'data' 'dist/data' -Recurse -Force
          New-Item -ItemType Directory -Force -Path 'dist/saves' | Out-Null
          New-Item -ItemType Directory -Force -Path 'dist/logs' | Out-Null
          Compress-Archive -Path 'dist/*' -DestinationPath 'Murim-Windows-x64.zip' -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: Murim-Windows-x64
          path: Murim-Windows-x64.zip
          if-no-files-found: error
