name: Deploy Murim Web

on:
  push:
    branches: [app-build]
    paths:
      - 'web-client/**'
      - 'src/**'
      - '.github/workflows/web-pages.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish web-client/Murim.Client.csproj -c Release -o web-client/bin/Release/net8.0/publish
      - name: Set GitHub Pages base path
        run: sed -i 's#<base href="/">#<base href="/murim.io/">#' web-client/bin/Release/net8.0/publish/wwwroot/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-client/bin/Release/net8.0/publish/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4
