name: Windows Beta Export

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-windows-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore C# projects
        run: dotnet restore client/MurimGame/MurimGame.csproj

      - name: Download Godot 4.7.2 .NET editor
        run: |
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64

      - name: Install Godot 4.7.2 .NET export templates
        run: |
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz
          rm -rf /tmp/godot-export-templates
          mkdir -p /tmp/godot-export-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          if [ -d /tmp/godot-export-templates/templates ]; then
            cp -a /tmp/godot-export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/"
          else
            cp -a /tmp/godot-export-templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable.mono/"
          fi
          ln -sfn 4.7.2.stable.mono "$HOME/.local/share/godot/export_templates/4.7.2.stable"

      - name: Import Godot project
        run: /tmp/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 --headless --editor --path client/MurimGame --quit-after 3

      - name: Export Windows x86_64 beta
        run: |
          rm -rf client/MurimGame/build/windows
          mkdir -p client/MurimGame/build/windows
          /tmp/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 --headless --path client/MurimGame --export-release "Windows Desktop" build/windows/Murim-Beta.exe
          test -f client/MurimGame/build/windows/Murim-Beta.exe
          test -f client/MurimGame/build/windows/Murim-Beta.pck
          find client/MurimGame/build/windows -maxdepth 1 -type d -name 'data_*' | grep -q . || (echo "Missing required .NET data directory" && exit 1)

      - name: Build portable folder
        run: |
          rm -rf package
          mkdir -p package/Murim-Beta
          cp -a client/MurimGame/build/windows/. package/Murim-Beta/
          find package/Murim-Beta -type f -name '*.pdb' -delete

          mkdir -p package/Murim-Beta/Content/Images/{World,Regions,Cities,Villages,Sects,Families,Ruins,Wilderness,Districts,Buildings,Interiors,Monsters,Items,Techniques,Portraits}
          mkdir -p package/Murim-Beta/Content/Audio/{Music,Ambience,Weather,SFX}
          mkdir -p package/Murim-Beta/Content/Data/{World,Techniques,Monsters,Items,Factions,Professions}
          mkdir -p package/Murim-Beta/Logs

          cat > package/Murim-Beta/Content/README-CONTENT.txt <<'EOF'
          CONTENU EXTERNE MURIM

          Ce dossier est volontairement séparé du moteur.
          Les illustrations .webp peuvent être ajoutées progressivement dans Content/Images.
          Le jeu recherche d'abord ces fichiers externes, puis utilise les ressources intégrées si nécessaire.

          Organisation principale :
          - Images/World, Cities, Villages, Sects, Families, Ruins, Wilderness, Districts...
          - Audio/Music, Ambience, Weather, SFX
          - Data/World, Techniques, Monsters, Items, Factions, Professions

          Ne supprimez pas Murim-Beta.pck ni le dossier data_MurimGame_windows_x86_64 à la racine : ils appartiennent au runtime Godot/.NET.
          EOF

          cat > package/Murim-Beta/Logs/README-LOGS.txt <<'EOF'
          Les journaux de diagnostic exportables pourront être regroupés ici dans les futures versions.
          Godot conserve également ses logs utilisateur dans AppData/Roaming/Godot/app_userdata/.
          EOF

          cat > package/Murim-Beta/README-LANCEMENT.txt <<'EOF'
          MURIM — UNE VIE PARMI DES MILLIERS — BETA 0.1.3

          1. Gardez tout le dossier Murim-Beta ensemble.
          2. Lancez Murim-Beta.exe.
          3. Murim-Beta.pck et data_MurimGame_windows_x86_64 sont indispensables au runtime.
          4. Content/ contient les futurs packs d'images, audio et données externes.
          5. Le premier démarrage construit un monde de 10 000 PNJ avec un écran d'initialisation.
          6. En cas de problème, consultez AppData/Roaming/Godot/app_userdata/ et Logs/.
          EOF

          printf '0.1.3-beta\n' > package/Murim-Beta/VERSION.txt
          cd package
          zip -r ../Murim-Beta-Windows-0.1.3.zip Murim-Beta

      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: murim-beta-windows
          path: Murim-Beta-Windows-0.1.3.zip
          if-no-files-found: error
          retention-days: 30

  smoke-test-exported-windows-exe:
    needs: export-windows-beta
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Download portable beta
        uses: actions/download-artifact@v4
        with:
          name: murim-beta-windows
          path: artifact

      - name: Extract portable beta
        shell: pwsh
        run: |
          Expand-Archive -Path artifact/Murim-Beta-Windows-0.1.3.zip -DestinationPath portable
          if (-not (Test-Path portable/Murim-Beta/Murim-Beta.exe)) { throw 'Murim-Beta.exe missing' }
          if (-not (Test-Path portable/Murim-Beta/Murim-Beta.pck)) { throw 'Murim-Beta.pck missing' }
          if (-not (Test-Path portable/Murim-Beta/Content/Images)) { throw 'External Content/Images folder missing' }
          if (-not (Test-Path portable/Murim-Beta/Content/Audio)) { throw 'External Content/Audio folder missing' }
          if (-not (Test-Path portable/Murim-Beta/Content/Data)) { throw 'External Content/Data folder missing' }
          if (-not (Test-Path portable/Murim-Beta/Logs)) { throw 'Logs folder missing' }
          $data = Get-ChildItem portable/Murim-Beta -Directory -Filter 'data_*'
          if (-not $data) { throw 'Required Godot .NET data directory missing' }

      - name: Launch exported Windows executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'portable/Murim-Beta/Murim-Beta.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--headless' -PassThru
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            $proc.Refresh()
            if ($proc.HasExited) {
              $logs = Get-ChildItem "$env:APPDATA/Godot/app_userdata" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'godot|crash|log' }
              foreach ($log in $logs) { Write-Host "=== $($log.FullName) ==="; Get-Content $log.FullName -ErrorAction SilentlyContinue }
              throw "Windows beta exited unexpectedly during startup with code $($proc.ExitCode)"
            }
          }
          Write-Host 'Windows beta remained alive for 30 seconds: no launch crash detected.'
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
