name: Build Murim WASM

on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - '.github/workflows/build-wasm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'
      - name: Compile C/C++ engine to WASM
        run: |
          mkdir -p dist
          em++ engine/murim_wasm.cpp engine/murim_engine.cpp engine/murim_core.c \
            -O3 -s WASM=1 -s MODULARIZE=1 -s EXPORT_ES6=1 \
            -s EXPORTED_FUNCTIONS='["_murim_seed","_murim_roll"]' \
            -s EXPORTED_RUNTIME_METHODS='[]' \
            -o dist/murim-engine.js
          test -s dist/murim-engine.wasm
          cp dist/murim-engine.wasm murim-engine.wasm
      - name: Publish generated WASM to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add murim-engine.wasm
          git diff --cached --quiet && exit 0
          git commit -m 'build: update Murim WASM engine'
          git push
