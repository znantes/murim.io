name: Build Godot C#

on:
  push:
    branches: [ main, app-build ]
  pull_request:
    branches: [ main, app-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Godot .NET
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.4.1-stable_mono_linux_x86_64.zip -d godot
          GODOT_BIN=$(find godot -maxdepth 2 -type f -name 'Godot*mono*linux*' | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Restore C# project
        run: dotnet restore Murim.io.csproj

      - name: Build C# project
        run: dotnet build Murim.io.csproj --configuration Debug --no-restore

      - name: Build browser server
        run: dotnet build web/Murim.Web.csproj --configuration Release

      - name: Build standalone browser client
        run: dotnet publish web-client/Murim.Client.csproj --configuration Release --output web-client/publish

      - name: Let Godot build and register the C# project
        run: |
          "$GODOT_BIN" --headless --path . --editor --build-solutions --quit

      - name: Inspect Godot C# assembly output
        run: |
          echo '--- .godot/mono files ---'
          find .godot/mono -type f -name '*.dll' -print 2>/dev/null || true
          echo '--- Murim.io.dll files ---'
          find . -type f -name 'Murim.io.dll' -print

      - name: Run headless game smoke test
        timeout-minutes: 2
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --verbose --quit-after 5 2>&1 | tee godot-smoke.log
          godot_status=${PIPESTATUS[0]}
          if [ "$godot_status" -ne 0 ]; then
            echo "Godot exited with status $godot_status"
            exit "$godot_status"
          fi
          if grep -E '(^ERROR:|SCRIPT ERROR|Unhandled exception|System\.[A-Za-z]+Exception)' godot-smoke.log; then
            echo 'Godot reported a runtime error during the smoke test.'
            exit 1
          fi
