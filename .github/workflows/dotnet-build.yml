name: Build Godot C#

on:
  push:
    branches: [ main, app-build ]
  pull_request:
    branches: [ main, app-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Godot .NET
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.4.1-stable_mono_linux_x86_64.zip -d godot
          GODOT_BIN=$(find godot -maxdepth 2 -type f -name 'Godot*mono*linux*' | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and build C# project
        run: |
          "$GODOT_BIN" --headless --path . --editor --quit-after 2
          dotnet build Murim.io.csproj --no-restore
      - name: Run headless game smoke test
        timeout-minutes: 2
        run: |
          "$GODOT_BIN" --headless --path . --quit-after 5
