<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murim — Les Mille Destins</title><style>html,body{margin:0;height:100%;background:#070a0f;color:#e8dfd2;font-family:Georgia,serif}body{display:flex;flex-direction:column}.bar{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#111923;border-bottom:1px solid #2a3542;font-size:13px}.bar b{color:#f0d49a}.ok{color:#8fd4aa}.bar button{background:#1a2532;color:#eee;border:1px solid #3a4756;border-radius:7px;padding:6px 9px;cursor:pointer}iframe{border:0;width:100%;flex:1;min-height:0;background:#080b10}</style></head><body><div class="bar"><span><b>Murim V3</b> · Personnalités dynamiques</span><span class="ok" id="status">Initialisation…</span><button onclick="location.reload()">Actualiser</button></div><iframe id="game" src="jeu-v3-fix.html" title="Murim V3"></iframe><script>(function(){const f=document.getElementById('game'),status=document.getElementById('status');function install(){try{const d=f.contentDocument;if(!d||!d.body)return setTimeout(install,100);if(d.getElementById('murimTraitsLoader'))return;const s=d.createElement('script');s.id='murimTraitsLoader';s.src='traits-system.js';s.onload=()=>status.textContent='Personnalités activées';s.onerror=()=>status.textContent='Erreur personnalité';d.body.appendChild(s)}catch(e){console.error(e);status.textContent='Erreur correction'}}f.addEventListener('load',install);})();</script></body></html>
