<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murim — Les Mille Destins V3 (Fix)</title><style>html,body{margin:0;height:100%;background:#070a0f;color:#e8dfd2;font-family:Georgia,serif}body{display:flex;flex-direction:column}.bar{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:#111923;border-bottom:1px solid #2a3542;font-size:13px}.bar b{color:#f0d49a}.ok{color:#8fd4aa}.bar button{background:#1a2532;color:#eee;border:1px solid #3a4756;border-radius:7px;padding:6px 9px;cursor:pointer}iframe{border:0;width:100%;flex:1;min-height:0;background:#080b10}</style></head><body><div class="bar"><span><b>Murim V3 — moteur corrigé</b> · Temps dynamique · déplacements réels · PNJ synchronisés · enfance cohérente</span><span class="ok" id="status">Initialisation…</span><button onclick="location.reload()">Actualiser</button></div><iframe id="game" src="jeu-v3.html" title="Murim V3"></iframe><script>(function(){const f=document.getElementById('game'),status=document.getElementById('status');const REGION_HOME={'Plaines Centrales':'Maison familiale','Nord impérial':'Fort du Givre','Monts Cendrés':'Temple de la Cloche Vide','Forêt de Jade':'Forêt Verte','Vallée Blanche':'Académie de la Lune','Frontière Ouest':'Poste impérial','Rive des Mille Lanternes':'Quai marchand','Archipel des Brumes':'Port des Brumes'};const places={'Plaines Centrales':[['Village de Qingshui',20],['Capitale des Neuf Portes',35],['Marché des Trois Rivières',42],['Maison familiale',0]],'Nord impérial':[['Col des Neuf Nuages',18],['Fort du Givre',40]],'Monts Cendrés':[['Temple de la Cloche Vide',22],['Ruines du Pic Noir',55]],'Forêt de Jade':[['Forêt Verte',35],['Sanctuaire des Cent Pins',48]],'Vallée Blanche':[['Académie de la Lune',24],['Clinique de jade',30]],'Frontière Ouest':[['Poste impérial',28],['Camp des caravanes',60]],'Rive des Mille Lanternes':[['Quai marchand',25],['Cité des Lanternes',45]],'Archipel des Brumes':[['Port des Brumes',30],['Île du Silence',70]]};const anchors={'Plaines Centrales':0,'Rive des Mille Lanternes':120,'Forêt de Jade':180,'Vallée Blanche':250,'Monts Cendrés':310,'Nord impérial':390,'Frontière Ouest':520,'Archipel des Brumes':700};function regionOf(place){for(const [r,list] of Object.entries(places))if(list.some(x=>x[0]===place))return r;return null}function dist(a,b){return Math.abs((anchors[a]||0)-(anchors[b]||0))}function baby(p){return p&&p.age<2}function speed(p){return Math.max(3,4+(p.speed||1)*.85+(p.endurance||1)*.25)}function install(){try{const w=f.contentWindow;if(!w||!w.S||!w.document)return setTimeout(install,100);if(w.__murimFixInstalled)return;w.__murimFixInstalled=true;function babyUI(){const p=w.S.player;if(!p)return;const map=w.document.getElementById('map');if(map){const r=p.region||regionOf(p.location)||'Plaines Centrales';const local=places[r]||[];map.innerHTML=`<div style="grid-column:1/-1;padding:10px;border:1px solid #2a3542;border-radius:8px;background:#0b1118"><b>Région actuelle : ${r}</b><div style="font-size:12px;color:#9ca8b5;margin-top:4px">${baby(p)?'Tu es encore un bébé. Tu ne voyages pas seul. Les déplacements extérieurs sont verrouillés jusqu’à l’enfance.':'Les destinations affichées appartiennent à ta région actuelle. Les autres régions passent par un vrai trajet interrégional.'}</div></div>`;local.forEach(([name,km])=>{const b=w.document.createElement('button');b.textContent=`${name} · ${km} km`;b.style.cssText='width:100%;margin-top:6px;padding:9px;background:#1a2532;color:#eee;border:1px solid #3a4756;border-radius:8px;cursor:pointer';b.disabled=baby(p)&&name!==p.location;b.onclick=()=>w.travelTo(name);map.appendChild(b)});const regions=w.document.createElement('div');regions.style.cssText='grid-column:1/-1;margin-top:7px;padding:9px;border-top:1px solid #2a3542';regions.innerHTML='<b>Autres régions</b><div style="font-size:12px;color:#9ca8b5;margin:4px 0">Distance indicative depuis ta région. Ces voyages sont impossibles pour un bébé.</div>';Object.keys(places).filter(x=>x!==r).forEach(x=>{const b=w.document.createElement('button');b.textContent=`${x} · ~${dist(r,x)} km`;b.disabled=baby(p);b.style.cssText='width:auto;margin:4px 4px 0 0;padding:7px;background:#1a2532;color:#eee;border:1px solid #3a4756;border-radius:8px;cursor:pointer';b.onclick=()=>w.travelTo(REGION_HOME[x]);regions.appendChild(b)});map.appendChild(regions)}const custom=w.document.getElementById('custom');if(custom){custom.placeholder=baby(p)?'Ex. Je reste auprès de ma famille. Je regarde les visages. Je dors. Je consulte le médecin.':'Ex. Je retourne à ma famille à pied. Je cherche un médecin. Je veux travailler chez un forgeron.';custom.title=baby(p)?'À cet âge, les actions doivent rester compatibles avec un bébé.':''}}const originalRender=w.render;w.render=function(){originalRender();babyUI()};const originalAddDays=w.addDays;w.addDays=function(n){n=Math.max(0,Math.floor(Number(n)||0));for(let i=0;i<n;i++){if(w.S.player){w.S.player.ageDays=(w.S.player.ageDays||0)+1;w.S.player.age=Math.floor(w.S.player.ageDays/365)}originalAddDays(1)}if(w.render)w.render()};const originalTravel=w.travelTo;w.travelTo=function(place){const p=w.S.player;if(!p||!p.alive)return;if(baby(p)){if(w.setStory)w.setStory('<div class="event"><b>Trop jeune pour voyager seul</b><br>Tu es encore un bébé. Tu restes sous la surveillance de ta famille ou de la personne qui te garde. Tes déplacements autonomes sont verrouillés jusqu’à l’enfance.</div>');if(w.render)w.render();return}const fromRegion=p.region||regionOf(p.location)||'Plaines Centrales',toRegion=regionOf(place)||fromRegion;const localKm=(places[fromRegion]?.find(x=>x[0]===p.location)?.[1]||0)+(places[toRegion]?.find(x=>x[0]===place)?.[1]||0);const km=Math.max(1,dist(fromRegion,toRegion)+localKm);const days=Math.max(1,Math.ceil(km/speed(p)));p.region=toRegion;p.location=place;p.travel=(p.travel||0)+days;w.addDays(days);if(w.rumor)w.rumor(`${p.name} arrive à ${place} après ${days} jour(s) de voyage.`,'voyage');if(w.setStory)w.setStory(`<div class="event"><b>Voyage terminé</b><br>Tu arrives à <b>${place}</b> après <b>${days} jour(s)</b> et environ ${km} km de trajet.<br><br>Pendant ton absence, les PNJ ont eux aussi vécu ${days} jour(s).</div>`);if(w.render)w.render()};const originalCustom=w.doCustom;w.doCustom=function(){const p=w.S.player;if(!p||!p.alive)return;const el=w.document.getElementById('custom');const raw=el?.value?.trim()||'';const t=raw.toLowerCase();if(baby(p)){if(/retour|rentre|voyage|pars|partir|aller à|aller au|aller en|quitter|route|marcher|marche/.test(t)){if(w.setStory)w.setStory('<div class="event"><b>Action impossible à cet âge</b><br>Tu es encore un bébé. Tu ne peux pas entreprendre seul un voyage ou quitter ton lieu de vie. Tu peux observer, dormir, être soigné et interagir avec les personnes qui prennent soin de toi.</div>');return}if(!/observe|regarde|regarder|dors|dormir|repos|médecin|docteur|famille|mère|père|frère|soeur|sœur|joue|jouer|écoute|écouter/.test(t)){if(w.setStory)w.setStory('<div class="event"><b>Action adaptée à l’enfance</b><br>À ton âge, cette action est trop ambitieuse. Le monde continue autour de toi, mais tu dépends encore des adultes.</div>');return}}originalCustom()};const originalNewLife=w.newLife;w.newLife=function(){originalNewLife();if(w.S.player){w.S.player.ageDays=0;w.S.player.age=0;w.S.player.location=REGION_HOME[w.S.player.region]||'Maison familiale'}if(w.render)w.render()};status.textContent='Fix installé';babyUI()}catch(e){console.error(e);status.textContent='Erreur de correction'}};f.addEventListener('load',install)})();</script></body></html>
