<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murim — Les Mille Destins V3 (Fix)</title><style>html,body{margin:0;height:100%;background:#070a0f;color:#e8dfd2;font-family:Georgia,serif}body{display:flex;flex-direction:column}.bar{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;background:#111923;border-bottom:1px solid #2a3542;font-size:13px}.bar b{color:#f0d49a}.ok{color:#8fd4aa}.bar button{background:#1a2532;color:#eee;border:1px solid #3a4756;border-radius:7px;padding:6px 9px;cursor:pointer}iframe{border:0;width:100%;flex:1;min-height:0;background:#080b10}</style></head><body><div class="bar"><span><b>Murim V3 — moteur corrigé</b> · Temps dynamique · déplacements réels · PNJ synchronisés</span><span class="ok" id="status">Initialisation…</span><button onclick="location.reload()">Actualiser</button></div><iframe id="game" src="jeu-v3.html" title="Murim V3"></iframe><script>(function(){const f=document.getElementById('game'),status=document.getElementById('status');const DAYS={"Plaines Centrales":0,"Nord impérial":260,"Monts Cendrés":210,"Forêt de Jade":180,"Vallée Blanche":250,"Frontière Ouest":420,"Rive des Mille Lanternes":160,"Archipel des Brumes":620};const places={"Plaines Centrales":[['Village de Qingshui',20],['Capitale des Neuf Portes',35],['Marché des Trois Rivières',42],['Maison familiale',0]],"Nord impérial":[['Col des Neuf Nuages',18],['Fort du Givre',40]],"Monts Cendrés":[['Temple de la Cloche Vide',22],['Ruines du Pic Noir',55]],"Forêt de Jade":[['Forêt Verte',35],['Sanctuaire des Cent Pins',48]],"Vallée Blanche":[['Académie de la Lune',24],['Clinique de jade',30]],"Frontière Ouest":[['Poste impérial',28],['Camp des caravanes',60]],"Rive des Mille Lanternes":[['Quai marchand',25],['Cité des Lanternes',45]],"Archipel des Brumes":[['Port des Brumes',30],['Île du Silence',70]]};function regionOf(place){for(const [r,list] of Object.entries(places))if(list.some(x=>x[0]===place))return r;return null}function distance(r1,l1,r2,l2){const base=Math.abs((DAYS[r1]||0)-(DAYS[r2]||0));const a=places[r1]?.find(x=>x[0]===l1)?.[1]||30;const b=places[r2]?.find(x=>x[0]===l2)?.[1]||30;return Math.max(0,base)+a+b}function install(){try{const w=f.contentWindow;if(!w||!w.S)return setTimeout(install,100);if(w.__murimFixInstalled)return;w.__murimFixInstalled=true;const originalAddDays=w.addDays;w.addDays=function(n){n=Math.max(0,Math.floor(Number(n)||0));for(let i=0;i<n;i++){if(w.S.player){w.S.player.ageDays=(w.S.player.ageDays||0)+1;w.S.player.age=Math.floor(w.S.player.ageDays/365)}originalAddDays(1)}if(w.render)w.render()};const originalTravel=w.travelTo;w.travelTo=function(place){const p=w.S.player;if(!p||!p.alive)return;const targetRegion=regionOf(place);if(!targetRegion)return originalTravel(place);const km=distance(p.region,p.location,targetRegion,place);const speed=Math.max(2.2,4+(p.speed||1)*0.85+(p.endurance||1)*0.25);const days=Math.max(1,Math.ceil(km/speed));p.region=targetRegion;p.location=place;p.travel=(p.travel||0)+days;w.addDays(days);if(w.rumor)w.rumor(`${p.name} arrive à ${place} après ${days} jour(s) de voyage.`,`voyage`);if(w.setStory)w.setStory(`<div class="event"><b>Voyage terminé</b><br>Tu arrives à <b>${place}</b> après <b>${days} jour(s)</b> et environ ${km} km de trajet.<br><br>Pendant ton absence, les PNJ ont eux aussi vécu ${days} jour(s).</div>`);if(w.render)w.render()};const originalCustom=w.doCustom;w.doCustom=function(){const p=w.S.player;if(!p||!p.alive)return;const el=w.document.getElementById('custom');const raw=el?.value?.trim()||'';const t=raw.toLowerCase();if((t.includes('retour')||t.includes('rentre'))&&p.location!=='Maison familiale'){const targetRegion='Plaines Centrales',target='Maison familiale';const km=distance(p.region,p.location,targetRegion,target);const speed=Math.max(2.2,4+(p.speed||1)*0.85+(p.endurance||1)*0.25);const days=Math.max(1,Math.ceil(km/speed));p.region=targetRegion;p.location=target;p.travel=(p.travel||0)+days;w.addDays(days);if(w.rumor)w.rumor(`${p.name} rentre vers sa famille après un long voyage de ${days} jour(s).`,'observation');if(w.setStory)w.setStory(`<div class="event"><b>Retour vers la famille</b><br>Tu rentres vers ta famille à pied depuis ${raw.includes('plaines')?'les Plaines Centrales':'ta région actuelle'}.<br><br><b>${days} jour(s)</b> de voyage ont été nécessaires. Pendant ces ${days} jours, le Jianghu et les PNJ ont continué d'évoluer.</div>`);if(el)el.value='';if(w.render)w.render();return}originalCustom()};const originalNewLife=w.newLife;w.newLife=function(){originalNewLife();if(w.S.player){w.S.player.ageDays=0;w.S.player.age=0}if(w.render)w.render()};status.textContent='Fix installé';}catch(e){console.error(e);status.textContent='Erreur de correction';}};f.addEventListener('load',install);})();</script></body></html>
