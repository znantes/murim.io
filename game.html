<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murim — Les Mille Destins</title>
<style>
html,body{margin:0;height:100%;background:#070a0f;color:#e8dfd2;font-family:Georgia,serif;overflow:hidden}
body{display:flex;flex-direction:column}.bar{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:#111923;border-bottom:1px solid #2a3542;font-size:13px;flex-wrap:wrap}.bar b{color:#f0d49a}.ok{color:#8fd4aa}.tools{display:flex;gap:7px;align-items:center}.bar button{background:#1a2532;color:#eee;border:1px solid #3a4756;border-radius:7px;padding:7px 10px;cursor:pointer}.bar button:hover{border-color:#d8af69}.bar button.primary{background:#6a4a21;border-color:#b2874e}.bar button:disabled{opacity:.5;cursor:wait}iframe{border:0;width:100%;flex:1;min-height:0;background:#080b10}body.fullscreen .bar{display:none}body.fullscreen iframe{height:100vh}
</style>
</head>
<body>
<div class="bar"><span><b>Murim — Les Mille Destins</b> · Jianghu vivant · immersion · découverte progressive</span><span class="tools"><span class="ok" id="status">Chargement du Jianghu…</span><button class="primary" id="start" type="button" disabled>Nouvelle vie</button><button id="expand" type="button">⛶ Agrandir</button><button id="reload" type="button">Actualiser</button></span></div>
<iframe id="game" src="jeu-v3.html" title="Murim — Les Mille Destins"></iframe>
<script>
(function(){'use strict';
const f=document.getElementById('game'),status=document.getElementById('status'),start=document.getElementById('start');
const scripts=['data/techniques-5000.js','manuals/catalog.js','traits-system.js','martial-system.js','technique-progression-fix.js','portrait-manifest.js','portrait-optimization.js','portrait-runtime.js','portrait-system.js','body-system.js','world-simulation.js','world-life-systems.js','world-integration.js','systems/simulation-core.js','systems/discovery-system.js','systems/discovery-ui.js','game-fixes.js','ui-enhancements.js','ui-rpg.js','engine/wasm-loader.js'];
function loadScript(src){return new Promise((resolve,reject)=>{const d=f.contentDocument;if(!d||!d.body)return reject(new Error('document-jeu-indisponible'));if(d.getElementById('boot-'+src))return resolve(true);const s=d.createElement('script');s.id='boot-'+src;s.src=src;s.onload=()=>resolve(true);s.onerror=()=>reject(new Error('fichier-manquant:'+src));d.body.appendChild(s)})}
function loadCSS(src){const d=f.contentDocument;if(!d||d.getElementById('boot-css-'+src))return;const l=d.createElement('link');l.id='boot-css-'+src;l.rel='stylesheet';l.href=src;d.head.appendChild(l)}
async function boot(){
 const d=f.contentDocument,w=f.contentWindow;if(!d||!w)return;
 loadCSS('ui-refonte.css');loadCSS('body-system.css');
 try{w.eval('if(typeof S!=="undefined") window.S=S;');}catch(e){console.error(e)}
 const results=await Promise.allSettled(scripts.map(loadScript));
 const failed=results.filter(x=>x.status==='rejected');
 try{const brand=d.querySelector('.brand');if(brand)brand.textContent='武林 · MURIM';const title=d.querySelector('title');if(title)title.textContent='Murim — Les Mille Destins';if(w.MurimBody&&w.MurimBody.build)w.MurimBody.build();if(w.MurimPortraits&&w.MurimPortraits.refresh)w.MurimPortraits.refresh();if(w.MurimPortraitAI&&w.MurimPortraitAI.refresh)w.MurimPortraitAI.refresh();if(w.render)w.render();}catch(e){console.error(e)}
 start.disabled=false;status.textContent=failed.length?`Jianghu chargé · ${failed.length} module(s) optionnel(s) indisponible(s)`:'Jianghu chargé · systèmes actifs · portraits à la demande';
}
f.addEventListener('load',()=>setTimeout(boot,0),{once:true});
start.onclick=()=>{try{const w=f.contentWindow;if(typeof w.newLife==='function')w.newLife();else throw new Error('Nouvelle vie indisponible')}catch(e){console.error(e);status.textContent='Impossible de créer la vie : '+e.message}};
document.getElementById('reload').onclick=()=>location.reload();
document.getElementById('expand').onclick=async()=>{try{if(!document.fullscreenElement)await f.requestFullscreen();else await document.exitFullscreen()}catch(e){console.error(e)}};
})();
</script>
</body>
</html>
