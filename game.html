<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murim — Les Mille Destins</title><style>html,body{margin:0;height:100%;background:#070a0f;color:#e8dfd2;font-family:Georgia,serif;overflow:hidden}body{display:flex;flex-direction:column}.bar{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:#111923;border-bottom:1px solid #2a3542;font-size:13px;flex-wrap:wrap}.bar b{color:#f0d49a}.ok{color:#8fd4aa}.bar button{background:#1a2532;color:#eee;border:1px solid #3a4756;border-radius:7px;padding:7px 10px;cursor:pointer}.bar button:hover{border-color:#d8af69}.tools{display:flex;gap:7px;align-items:center}iframe{border:0;width:100%;flex:1;min-height:0;background:#080b10}body.fullscreen .bar{display:none}body.fullscreen iframe{height:100vh}</style></head><body><div class="bar"><span><b>Murim — Les Mille Destins</b> · Jianghu vivant · interface RPG V5 · simulation autonome</span><span class="tools"><span class="ok" id="status">Initialisation…</span><button id="expand" type="button">⛶ Agrandir</button><button id="reload" type="button">Actualiser</button></span></div><iframe id="game" src="jeu-v3.html" title="Murim — Les Mille Destins"></iframe><script>(function(){'use strict';const f=document.getElementById('game'),status=document.getElementById('status');const scripts=['traits-system.js','martial-system.js','technique-progression-fix.js','portrait-manifest.js','portrait-optimization.js','portrait-runtime.js','portrait-system.js','body-system.js','world-simulation.js','world-life-systems.js','game-fixes.js','ui-enhancements.js','ui-rpg.js','engine/wasm-loader.js'];function loadScript(src){return new Promise((resolve,reject)=>{const d=f.contentDocument;if(!d||!d.body)return reject(new Error('game-document-not-ready'));if(d.getElementById('boot-'+src))return resolve();const s=d.createElement('script');s.id='boot-'+src;s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('load-failed:'+src));d.body.appendChild(s)})}function loadCSS(src){const d=f.contentDocument;if(!d||d.getElementById('boot-css-'+src))return;const l=d.createElement('link');l.id='boot-css-'+src;l.rel='stylesheet';l.href=src;d.head.appendChild(l)}function waitForGame(){const w=f.contentWindow;if(!w||!w.S||!w.document){setTimeout(waitForGame,100);return}loadCSS('ui-refonte.css');loadCSS('body-system.css');Promise.resolve().then(()=>scripts.reduce((p,s)=>p.then(()=>loadScript(s)),Promise.resolve())).then(async()=>{try{const brand=f.contentDocument.querySelector('.brand');if(brand)brand.textContent='武林 · MURIM';const title=f.contentDocument.querySelector('title');if(title)title.textContent='Murim — Les Mille Destins';if(w.MurimBody)w.MurimBody.build();if(w.MurimPortraits)w.MurimPortraits.refresh();if(w.MurimPortraitAI)w.MurimPortraitAI.refresh();if(w.MurimEngine&&w.MurimEngine.init)await w.MurimEngine.init('murim-engine.wasm')}catch(e){console.error(e)}status.textContent='Simulation V5 · société · villes · généalogie · conflits · enquêtes · chroniques · WASM';}).catch(e=>{console.error(e);status.textContent='Erreur : '+e.message})}f.addEventListener('load',waitForGame);document.getElementById('reload').onclick=()=>location.reload();document.getElementById('expand').onclick=async()=>{try{if(!document.fullscreenElement){await f.requestFullscreen();document.body.classList.add('fullscreen')}else await document.exitFullscreen()}catch(e){console.error(e)}};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('fullscreen')});})();</script></body></html>
